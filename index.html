<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tabelo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: landing satu kolom dengan hero dua kolom (teks + contoh tabel hidup); aplikasi memakai sidebar kiri + area kerja. Aksen hijau, penanda kuning hanya pada satu kata di hero. */
:root{
  --bg:#F2F5F7;--surface:#FFFFFF;--fg:#0F1B2D;--muted:#586578;--line:#DCE2E9;
  --accent:#0B7A5C;--accent-fg:#FFFFFF;--accent-soft:#DDF2EA;--hi:#F2B632;
  --k0:#586578;--k1:#946016;--k2:#0B7A5C;--k3:#2B63C9;--k4:#B4304F;--k5:#7040C4;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 10px 28px rgba(15,27,45,.07);
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;
  --c-oth:#898781;--grid:#E1E0D9;--axis:#C3C2B7;--crit:#d03b3b;--warn:#fab219;
  --font-d:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --font-b:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1117;--surface:#141B24;--fg:#E7ECF2;--muted:#95A2B4;--line:#263140;
  --accent:#3FC79C;--accent-fg:#04150F;--accent-soft:#12372C;--hi:#F2B632;
  --k0:#95A2B4;--k1:#E3A94A;--k2:#3FC79C;--k3:#6B9BF2;--k4:#EE7C95;--k5:#A786F0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#0ca30c;--c7:#9085e9;--c8:#e66767;--grid:#2c2c2a;--axis:#383835;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1117;--surface:#141B24;--fg:#E7ECF2;--muted:#95A2B4;--line:#263140;
  --accent:#3FC79C;--accent-fg:#04150F;--accent-soft:#12372C;--hi:#F2B632;
  --k0:#95A2B4;--k1:#E3A94A;--k2:#3FC79C;--k3:#6B9BF2;--k4:#EE7C95;--k5:#A786F0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#0ca30c;--c7:#9085e9;--c8:#e66767;--grid:#2c2c2a;--axis:#383835;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--font-d);letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 22px;font-size:15.5px;border-radius:12px}
.iconbtn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;font-size:17px;line-height:1}
.iconbtn:hover{background:var(--accent-soft)}
.brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-d);font-weight:700;font-size:21px;text-decoration:none;letter-spacing:-.02em}

/* Landing */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
.nav .links{display:flex;gap:6px;margin-right:auto;margin-left:12px}
.nav .actions{display:flex;gap:8px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;align-items:center;padding:56px 0 64px}
.hero h1{font-size:clamp(2.3rem,5.2vw,3.7rem)}
.hero mark{background:linear-gradient(transparent 58%,var(--hi) 58% 92%,transparent 92%);color:inherit;padding:0 .08em}
.hero .lead{font-size:1.15rem;color:var(--muted);margin:20px 0 28px;max-width:34em}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero .fine{margin-top:16px;font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.demo{padding:14px;min-width:0}
.demohead{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 12px;gap:8px}
.demohead b{font-family:var(--font-d);font-size:1.05rem}
.demotabs{display:flex;gap:6px;padding:0 4px 12px;flex-wrap:wrap}
.pill{padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--line);color:var(--muted)}
.pill.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.section{padding:56px 0;border-top:1px solid var(--line)}
.section h2{font-size:clamp(1.7rem,3.4vw,2.4rem);max-width:18em}
.section .sub{color:var(--muted);margin-top:12px;max-width:38em}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:32px 36px;margin-top:36px}
.feat{border-top:2px solid var(--fg);padding-top:14px}
.feat h3{font-size:1.15rem;margin-bottom:6px}
.feat p{color:var(--muted)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:32px;align-items:stretch}
.plan{padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.plan.pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.plan h3{font-size:1.2rem}
.price{font-family:var(--font-d);font-size:2rem;font-weight:700;letter-spacing:-.02em}
.price small{font-family:var(--font-b);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;color:var(--muted);flex:1}
.plan li::before{content:"✓";color:var(--accent);font-weight:700;margin-right:8px}
.cta-end{margin:24px 0 8px;padding:40px 28px;text-align:center;display:grid;gap:18px;justify-items:center}
.cta-end h2{font-size:clamp(1.6rem,3.2vw,2.2rem)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:28px 0 40px;color:var(--muted);font-size:13.5px;border-top:1px solid var(--line);margin-top:40px}

/* Auth */
.auth{min-height:100vh;display:grid;align-content:center;justify-items:center;gap:24px;padding:40px 0}
.authcard{width:100%;max-width:420px;padding:30px 28px;display:grid;gap:18px}
.authcard h1{font-size:1.7rem}
.field{display:grid;gap:6px;font-weight:600;font-size:13.5px}
.field input,.lbl input,.lbl select{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:400;font-size:15px;width:100%}
.field input:focus,.lbl input:focus,.lbl select:focus{border-color:var(--accent)}
.err{color:var(--k4);font-weight:500;font-size:13px;min-height:1px}
.authcard form{display:grid;gap:14px}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.sep::before,.sep::after{content:"";height:1px;background:var(--line);flex:1}

/* App */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.search{flex:1;max-width:460px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.search input{border:0;background:transparent;padding:8px 0;flex:1;min-width:0;outline:0}
.search:focus-within{border-color:var(--accent)}
.tright{display:flex;align-items:center;gap:4px;position:relative}
.avatar{width:34px;height:34px;border-radius:50%;border:0;background:var(--k5);color:#fff;font-weight:700;cursor:pointer}
.menu{position:absolute;right:0;top:44px;width:240px;padding:12px;display:grid;gap:10px;z-index:25}
.menu small{display:block;color:var(--muted);overflow-wrap:anywhere}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;min-height:calc(100vh - 60px)}
.side{padding:18px 14px 18px 0;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.nav-i{display:block;padding:9px 12px;border-radius:9px;text-decoration:none;font-weight:600}
.nav-i:hover{background:var(--accent-soft)}
.nav-i.on{background:var(--accent-soft);color:var(--accent)}
.wshead{display:flex;align-items:center;justify-content:space-between;gap:4px}
.wshead .nav-i{flex:1}
.ws-i{display:block;padding:6px 12px 6px 24px;color:var(--muted);text-decoration:none;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-i:hover{color:var(--fg)}
.main{padding:28px 0 56px 28px;min-width:0}
.main h1{font-size:2rem;margin-bottom:20px}
.banner{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:18px 20px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--line);margin-bottom:22px}
.banner b{font-family:var(--font-d);font-size:1.1rem}
.banner .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:30px}
.start{padding:16px 18px;text-align:left;cursor:pointer;display:grid;gap:4px;font:inherit;color:inherit}
.start b{font-family:var(--font-d);font-size:1.05rem}
.start span{color:var(--muted);font-size:14px}
.start:hover{border-color:var(--accent)}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;gap:10px}
.sechead h2{font-size:1.15rem}
.blist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.bcard{display:flex;align-items:center;gap:6px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.bcard:hover{border-color:var(--accent)}
.bmain{display:flex;align-items:center;gap:12px;text-decoration:none;flex:1;min-width:0}
.tile{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--font-d);font-weight:700;font-size:1.2rem;flex:none}
.btxt{display:grid;min-width:0}
.btxt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btxt small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:44px 20px;text-align:center;display:grid;gap:8px;justify-items:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.empty h2{color:var(--fg);font-size:1.2rem}
.wscard{padding:18px;margin-bottom:16px;display:grid;gap:14px}
.wscard .sechead{margin:0}

/* Base */
.bhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bname{font-family:var(--font-d);font-weight:700;font-size:1.5rem;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;min-width:0;flex:1;letter-spacing:-.02em}
.bname:hover,.bname:focus{border-color:var(--line);background:var(--surface)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:9px 14px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab.add{font-weight:500}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{padding:6px 12px;border:0;background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.tools .grow{flex:1}
.tools input[type=search]{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);min-width:0;width:200px}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:640px}
.grid th{position:sticky;top:0;background:var(--bg);text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;user-select:none}
.grid th[data-act]{cursor:pointer}
.grid th[data-act]:hover{color:var(--fg)}
.grid th i{font-style:normal;font-family:var(--mono);font-size:11px;margin-right:6px;padding:1px 5px;border-radius:4px;background:var(--line)}
.grid td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:38px;min-width:130px}
.grid td.rn,.grid th.rn{min-width:46px;width:46px;text-align:center;color:var(--muted);font-size:12px;position:relative}
.grid tr:last-child td{border-bottom:0}
.grid td input[type=text],.grid td input[type=number],.grid td input[type=date]{width:100%;height:38px;border:0;background:transparent;padding:0 10px;outline:0;font-size:14px}
.grid td input:focus{background:var(--accent-soft)}
.grid td input[type=checkbox]{width:18px;height:18px;margin:10px;accent-color:var(--accent);cursor:pointer}
.grid td.cs{padding:0 8px}
.grid .addcol{min-width:48px;width:48px;text-align:center}
.grid .addcol button{border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--muted)}
.chip,.chipsel{--k:var(--k0);padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--k);background:color-mix(in srgb,var(--k) 15%,var(--surface));display:inline-block}
.chipsel{border:0;appearance:none;-webkit-appearance:none;cursor:pointer;padding:4px 12px;min-width:84px;text-align:left}
.chipsel.empty{--k:var(--muted);background:transparent;border:1px dashed var(--line);padding:3px 11px;border-radius:999px}
.chipsel option{color:var(--fg);background:var(--surface)}
.gfoot{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;color:var(--muted);font-size:13px;gap:8px;flex-wrap:wrap}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.kcol{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.khead{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 4px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.kcard b{font-weight:600;overflow-wrap:anywhere}
.kcard small{color:var(--muted);overflow-wrap:anywhere}
.movesel{padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;justify-self:start;max-width:100%}
.kadd{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px;color:var(--muted);cursor:pointer;font-weight:500}
.kadd:hover{color:var(--fg);border-color:var(--muted)}

/* Analisis */
.anhead{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 18px}
.sl{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.sl select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:14px;font-weight:400;max-width:100%}
.sl select:focus{border-color:var(--accent)}
.fchips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.fchip{border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px;min-width:0;align-content:start}
.kl{font-size:13px;color:var(--muted)}
.kv{font-family:var(--font-d);font-size:1.7rem;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.ks{font-size:12.5px;color:var(--muted)}
.ash{font-size:1.25rem;margin:32px 0 4px}
.asub{color:var(--muted);font-size:14px;margin:0 0 14px}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.ac{padding:18px;min-width:0;display:grid;gap:12px;align-content:start}
.ac h3{font-size:1.05rem}
.ac .ah{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-end}
.ac .ctl{display:flex;gap:10px;flex-wrap:wrap}
.ins{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.ins li{position:relative;padding-left:18px;line-height:1.5}
.ins li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:2px;background:var(--accent)}
.dw{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dw svg{flex:none;max-width:100%;height:auto}
.dn{font-family:var(--font-d);font-size:26px;font-weight:700;fill:var(--fg)}
.ds{font-size:11px;fill:var(--muted)}
.dseg{cursor:pointer;transition:opacity .15s}
.dseg.dim{opacity:.3}
.dseg:hover{opacity:.85}
.lg{list-style:none;margin:0;padding:0;display:grid;gap:2px;flex:1;min-width:150px}
.lgi{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.lgi:hover,.lgi.on{background:var(--accent-soft)}
.lgi i{width:10px;height:10px;border-radius:3px}
.lgn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgv{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.hb{display:grid;gap:4px}
.hr{display:grid;grid-template-columns:minmax(64px,120px) minmax(0,1fr);gap:10px;align-items:center;padding:4px 6px;border-radius:8px}
.hr[data-act]{cursor:pointer}
.hr[data-act]:hover{background:var(--accent-soft)}
.hr.dim{opacity:.4}
.hl{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hz{position:relative;height:18px;margin-right:84px}
.hf{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.hv{position:absolute;top:50%;transform:translateY(-50%);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px 14px}
.sg div{display:grid;gap:1px}
.sg small{color:var(--muted);font-size:12px}
.sg b{font-size:15px;font-weight:600}
.cp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;padding-top:16px}
.cy{position:relative;height:160px;min-width:24px}
.cy span{position:absolute;right:0;transform:translateY(50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cb{position:relative;height:160px;border-bottom:1px solid var(--axis)}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.cw{position:absolute;inset:0;display:flex;gap:2px}
.cslot{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:4px 4px 0 0}
.cslot:hover,.cslot:focus-visible{background:var(--accent-soft)}
.bar{position:relative;display:block;width:min(100%,28px);background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.bar em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;padding-bottom:2px;white-space:nowrap}
.cx{display:flex;gap:2px;margin-top:6px;height:16px}
.cx span{flex:1;min-width:0;display:flex;justify-content:center}
.cx b{font-weight:400;font-size:11px;color:var(--muted);white-space:nowrap}
.sv{width:100%;max-width:560px;height:auto;display:block}
.sv text{fill:var(--muted);font-size:11px}
.sv .gl2{stroke:var(--grid);stroke-width:1}
.sv .ax2{stroke:var(--axis);stroke-width:1}

.sv circle.pt{fill:var(--accent);stroke:var(--surface);stroke-width:2;cursor:default}
.dl{list-style:none;margin:0;padding:0}
.dl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:10px 0;border-top:1px solid var(--line)}
.dl li:first-child{border-top:0}
.dl small{color:var(--muted)}
.dl .st{display:inline-flex;gap:7px;align-items:center;font-size:13px;grid-row:1/3;grid-column:2;white-space:nowrap}
.st i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tv summary{cursor:pointer;color:var(--muted);font-size:13px;width:max-content}
.tvw{overflow-x:auto;margin-top:8px}
.tvw table{border-collapse:collapse;width:100%;font-size:13.5px}
.tvw th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tvw td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tvw.prof table{min-width:620px}
.fillbar{height:6px;border-radius:3px;background:var(--line);min-width:70px;margin-bottom:3px}
.fillbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ti{font-style:normal;font-family:var(--mono);font-size:11px;margin-right:7px;padding:1px 5px;border-radius:4px;background:var(--line)}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:13px;max-width:260px;box-shadow:var(--shadow);line-height:1.4}
.side .nav-i[href="#analisis"]{margin-top:6px}

/* Tipe kolom */
.grid th .thm{margin-left:8px;border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 5px;border-radius:5px;font-size:15px;line-height:1.2}
.grid th .thm:hover{background:var(--line);color:var(--fg)}
.grid td.wide{min-width:200px}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 8px;min-height:38px}
.lkc{background:color-mix(in srgb,var(--c1) 14%,var(--surface));border-radius:6px;padding:2px 8px;font-size:12.5px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addlk{border:1px dashed var(--line);background:transparent;border-radius:6px;min-width:24px;height:24px;cursor:pointer;color:var(--muted);font-size:14px;line-height:1}
.addlk:hover{border-color:var(--accent);color:var(--accent)}
.att{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:0;height:26px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;overflow:hidden;max-width:150px;font-size:12px;color:var(--fg)}
.att img{width:26px;height:26px;object-fit:cover;display:block}
.att span{padding-right:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att.f span{padding-left:7px}
.grid td .lk{display:flex;align-items:center;height:38px}
.grid td .lk input[type=text]{width:auto;flex:1;min-width:0}
.go{flex:none;width:30px;height:30px;margin-right:4px;display:inline-grid;place-items:center;border-radius:6px;color:var(--accent);text-decoration:none;border:0;background:transparent;cursor:pointer;font-size:15px}
.go:hover{background:var(--accent-soft)}
.ro{padding:0 10px;display:flex;align-items:center;height:38px;font-size:14px;white-space:nowrap}
.fxe{color:var(--k4);font-weight:600}
.cellbtn{display:inline-flex;align-items:center;margin:0 8px;height:26px;padding:0 12px;border-radius:7px;background:var(--accent);color:var(--accent-fg);font-size:12.5px;font-weight:600;text-decoration:none;border:0;cursor:pointer;white-space:nowrap}
.cellbtn:hover{filter:brightness(1.08)}
.cellbtn[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed;filter:none}
.grid td:has(.cellbtn){height:38px}
.lbl textarea{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font:inherit;font-size:14px;width:100%;resize:vertical}
.lbl textarea:focus{border-color:var(--accent)}
.lbl input[type=checkbox],.lbl input[type=radio]{width:auto;padding:0;flex:none}
.lkshow .chk{justify-content:flex-start}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px}
.chk input{accent-color:var(--accent)}
.hint{color:var(--muted);font-size:12.5px;line-height:1.45;margin:0}
.fsec{display:grid;gap:12px}
.bsec{display:grid;gap:12px}
.lkshow{display:grid;gap:6px;font-weight:400}
.pickl{display:grid;gap:6px;max-height:44vh;overflow:auto}
.pksearch{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);width:100%}
.pk{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.pk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pk input{margin-top:3px;accent-color:var(--accent)}
.pk span{display:grid;gap:1px;min-width:0}
.pk small{color:var(--muted)}
.prev img,.prev video{max-width:100%;max-height:60vh;border-radius:10px;display:block;margin:0 auto}
.prev iframe{width:100%;height:56vh;border:1px solid var(--line);border-radius:10px}
.menul{display:grid;gap:8px}
.menul .btn{justify-content:flex-start}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.modal form{display:grid;gap:14px}

/* Modal, toast */
.ovl{position:fixed;inset:0;z-index:50;background:rgba(8,12,18,.55);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:22px;display:grid;gap:16px;box-shadow:var(--shadow)}
.modal h2{font-size:1.35rem}
.modal form{display:grid;gap:14px}
.lbl{display:grid;gap:6px;font-weight:600;font-size:13.5px}
.mactions{display:flex;justify-content:flex-end;gap:8px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tpl{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.tpl:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tpl input{margin-top:4px;accent-color:var(--accent)}
.tpl span{display:grid;gap:2px}
.tpl small{color:var(--muted);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}

@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr);gap:32px;padding:36px 0 44px}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 0}
  .side .nav-i{white-space:nowrap}
  .side{align-items:center}
  .wshead{flex:none}
  .side .nav-i[href="#analisis"]{margin-top:0}
  .wshead button,.wslist{display:none}
  .main{padding:20px 0 48px}
  .search{margin:0}
}
@media (max-width:560px){
  .nav .links{display:none}
  .nav{gap:8px}
  .nav .actions{margin-left:auto}
  .brand span{font-size:19px}
  .top .brand span{display:none}
  .bhead .bname{flex:1 1 100%;order:1}
  .tools input[type=search]{width:140px}
}

/* ===== Grid ala spreadsheet, toolbar, panel ===== */
.app.sc{grid-template-columns:minmax(0,1fr)}
.app.sc .side{display:none}
.app.sc .main{padding-left:0}
.tools{row-gap:8px}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;border:1px solid transparent;background:transparent;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tbtn:hover,.tbtn[aria-expanded=true]{background:var(--accent-soft);color:var(--fg)}
.tbtn.act{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tbtn .tn{min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11px;display:inline-grid;place-items:center;padding:0 5px}
.vbtn{border-color:var(--line);background:var(--surface);color:var(--fg)}
.vbtn b{max-width:160px;overflow:hidden;text-overflow:ellipsis}
.tdiv{width:1px;height:22px;background:var(--line)}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;margin-top:10px;border-radius:10px;background:var(--accent-soft);color:var(--fg)}
#pop{position:fixed;z-index:45;width:min(380px,calc(100vw - 16px));padding:14px;display:grid;gap:10px;overflow:auto}
#pop.wide{width:min(620px,calc(100vw - 16px))}
#pop select,#pop input[type=text],#pop input[type=date]{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:13px;min-width:0}
.ph{font-weight:700;font-size:13px}
.pl{display:grid;gap:2px;max-height:300px;overflow:auto}
.pl2{display:grid;gap:8px}
.pf{display:flex;gap:8px;flex-wrap:wrap}
.pi{display:flex;gap:8px;text-align:left;padding:8px 10px;border:0;background:transparent;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px}
.pi:hover{background:var(--accent-soft)}
.pi.on{background:var(--accent-soft);color:var(--accent)}
.pi span{width:14px;flex:none}
.pc{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-size:14px;cursor:pointer}
.pc:hover{background:var(--accent-soft)}
.pc i{font-style:normal;font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:4px;background:var(--line);color:var(--muted)}
.pc small{color:var(--muted);margin-left:auto}
.pc input{accent-color:var(--accent)}
.flr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.flr select,.flr input{flex:1 1 110px}
.flr .flw{flex:none;width:62px;font-size:13px;color:var(--muted)}
.px{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:18px;padding:0 6px;line-height:1}
.px:hover{color:var(--fg)}
/* grid */
table.grid{table-layout:fixed;min-width:0;border-collapse:separate;border-spacing:0}
.gridwrap{max-height:calc(100vh - 260px);min-height:220px;overflow:auto}
.grid th{padding:0;height:36px}
.grid th .thi{display:flex;align-items:center;height:36px;padding:0 4px 0 10px;overflow:hidden}
.grid th .thn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.grid th .thn:hover{color:var(--fg)}
.grid th .thn sup{font-size:9px;margin-left:2px}
.grid th .thm{margin-left:2px;flex:none}
.grid th .rz{position:absolute;top:0;right:-3px;bottom:0;width:8px;cursor:col-resize;touch-action:none;z-index:3}
.grid th .rz:hover,body.rzing .grid th .rz{background:color-mix(in srgb,var(--accent) 55%,transparent)}
body.rzing{cursor:col-resize;user-select:none}
.grid td{height:var(--rh,38px);min-width:0;vertical-align:top;overflow:hidden;background:color-mix(in srgb,var(--rc,var(--surface)) 9%,var(--surface))}
.grid td.wide,.grid td.cs{min-width:0}
.grid tr.sel td{background:var(--accent-soft)}
.grid tr.cur td{box-shadow:inset 0 -2px 0 var(--accent)}
.grid th.rn,.grid td.rn{width:78px;min-width:78px;max-width:78px;position:sticky;left:0;z-index:2;padding:0;text-align:left}
.grid th.rn{background:var(--bg);z-index:6;padding-left:14px}
.grid th.rn input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.grid th.fz{position:sticky;left:78px;z-index:5;box-shadow:1px 0 0 var(--line)}
.grid td.fz{position:sticky;left:78px;z-index:2;box-shadow:1px 0 0 var(--line)}
.rnw{display:flex;align-items:center;gap:2px;height:38px;padding:0 6px 0 8px}
.rno{color:var(--muted);font-size:12px;min-width:22px;text-align:center}
.rck{display:none;width:16px;height:16px;margin:0 3px;accent-color:var(--accent);cursor:pointer}
.xp{margin-left:auto;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:14px;padding:2px 4px;border-radius:5px;opacity:0}
.grid tr:hover .rck,.grid tr.sel .rck,.rnw:focus-within .rck{display:block}
.grid tr:hover .rno,.grid tr.sel .rno,.rnw:focus-within .rno{display:none}
.grid tr:hover .xp,.xp:focus-visible,.grid tr.sel .xp{opacity:1}
.xp:hover{background:var(--line);color:var(--fg)}
.grid td textarea{display:block;width:100%;height:calc(var(--rh,38px) - 1px);border:0;background:transparent;resize:none;padding:8px 10px;outline:0;font:inherit;font-size:14px;line-height:1.4}
.grid td textarea:focus{background:var(--accent-soft)}
.grid tr.grp td{height:34px;background:var(--bg);padding:0}
.gb{position:sticky;left:10px;display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;padding:6px 4px;font-size:13.5px}
.gb .gn{color:var(--muted);font-weight:500}
.grid tr.addtr td{height:40px;padding:0;border-bottom:0}
.addr{position:sticky;left:0;display:inline-block;border:0;background:transparent;height:40px;padding:0 14px;color:var(--muted);cursor:pointer;font-weight:600}
.addr:hover{color:var(--fg)}
.grid tr.emptyr td{height:56px;text-align:center;color:var(--muted);vertical-align:middle}
/* panel detail */
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(440px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) 0}
.dh{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}

.db{flex:1;overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.df{display:grid;gap:5px}
.dl{font-size:12.5px;font-weight:600;color:var(--muted)}
.dl i{font-style:normal;font-family:var(--mono);font-size:11px;margin-right:6px;padding:1px 5px;border-radius:4px;background:var(--line)}
.dcv input[type=text],.dcv input[type=number],.dcv input[type=date],.dcv textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;font:inherit;font-size:14px}

.dcv .lk input{flex:1;min-width:0}
.dhid{display:grid;gap:14px}

.dfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.kt{cursor:pointer}

@media (max-width:560px){

  .tdiv{display:none}

/* ===== Halaman utama layar penuh ===== */
body.lp{padding-left:0;padding-right:0}
.land .in{width:100%;max-width:1760px;margin:0 auto;padding-left:max(clamp(16px,4.5vw,88px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4.5vw,88px),env(safe-area-inset-right,0px))}
.land .nav{display:block;padding:0}
.land .navin{display:flex;align-items:center;gap:20px;padding-block:14px}
.herob{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:
  radial-gradient(900px 520px at 88% 12%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),
  radial-gradient(700px 480px at 4% 100%,color-mix(in srgb,var(--hi) 14%,transparent),transparent 70%),var(--bg)}
.herob .hero{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:clamp(32px,4.5vw,96px);min-height:calc(100vh - 68px);padding-block:clamp(36px,6vh,80px)}

.land .section.alt{background:var(--surface)}
.land .features{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.land .plans{grid-template-columns:repeat(3,minmax(0,1fr))}
.ctab{background:var(--accent);color:var(--accent-fg);padding:clamp(48px,7vw,96px) 0;text-align:center}
.ctab .in{display:grid;gap:22px;justify-items:center}
.ctab .btn{color:var(--fg);background:var(--surface)}

.land .foot{display:block;padding:0;margin:0}

/* contoh tabel beranimasi */
.dm{position:relative;padding:0;overflow:hidden;box-shadow:0 40px 90px -40px rgba(10,40,30,.45),var(--shadow);user-select:none}
.dm-top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.dm-dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:5px}
.dm-top b{font-family:var(--font-d);font-size:1.1rem;margin-right:auto}
.dm-sav{font-size:12.5px;color:var(--muted)}
.dm-sav.busy{color:var(--k1)}
.dm-bar{display:flex;gap:6px;align-items:center;padding:10px 18px;flex-wrap:wrap}
.dm-bar .sp{flex:1}
.dm-add{padding:5px 13px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:13px}
.dm-tools{display:flex;gap:2px;padding:0 12px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dm-tools .tbtn{cursor:default}
.dm-body{position:relative;height:clamp(300px,34vw,372px);overflow:hidden}
.dm table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:clamp(14px,1.05vw,16px)}
.dm th{text-align:left;font-size:12.5px;color:var(--muted);padding:0 12px;height:36px;background:var(--bg);border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm th i{font-style:normal;font-family:var(--mono);font-size:11px;margin-right:6px;padding:1px 5px;border-radius:4px;background:var(--line)}
.dm td{padding:0 12px;height:clamp(44px,3.4vw,52px);border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface)}
.dm th:last-child,.dm td:last-child{border-right:0}
.dm .dn{color:var(--muted);font-size:12px;text-align:center;padding:0}
.dm tr{position:relative}
.dm tr.newr td{animation:rowin .8s ease}
@keyframes rowin{from{background:var(--accent-soft)}}
.dm .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);display:inline-grid;place-items:center;vertical-align:middle;font-size:12px;color:var(--accent-fg);transition:background .2s}
.dm .ck.on{background:var(--accent);border-color:var(--accent);animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.caret::after{content:"";display:inline-block;width:1.5px;height:1.1em;background:var(--accent);margin-left:1px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dm-kan{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px;background:var(--bg);align-content:start}
.kcol2{display:grid;gap:8px;align-content:start;min-width:0}
.kh{display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;position:relative}
.kc small{color:var(--muted)}
.kc.lift{z-index:3;box-shadow:var(--shadow);border-color:var(--accent);transition:transform .95s cubic-bezier(.4,0,.2,1)}
.kc.drop{animation:dropin .5s ease}
@keyframes dropin{from{transform:scale(1.06);box-shadow:var(--shadow)}}
.dm-cur{position:absolute;left:0;top:0;z-index:6;pointer-events:none;transition:transform .95s cubic-bezier(.4,0,.2,1);will-change:transform}
.dm-cur svg{display:block;transition:transform .15s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.dm-cur.click svg{transform:scale(.82)}
.dm-cur .tag{position:absolute;left:16px;top:18px;padding:2px 8px;border-radius:6px;background:var(--k5);color:#fff;font-size:11.5px;font-weight:700;white-space:nowrap}
.dm-pop{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid;gap:2px;min-width:150px}
.dm-pop>span{padding:4px 6px;border-radius:7px}
.dm-pop>span.hv{background:var(--accent-soft)}
@media (max-width:1100px){.land .plans{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .herob .hero{grid-template-columns:minmax(0,1fr);min-height:0;padding-block:36px 44px}
}
@media (max-width:560px){
  .dm .c-a{display:none}
  .dm-body{height:300px}
  .dm-cur .tag{display:none}
}

.tab-ed{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 6px;margin-left:-6px;border-radius:6px;align-self:center}
.tab-ed:hover{background:var(--accent-soft);color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

    s.fields.forEach(function(sf,fi){

      var tt=tables[ti],f=tt.fields[fi],tg=tables[sf.target];
      f.target=tg.id;
      f.show=(sf.show||[]).map(function(n){var x=tg.fields.filter(function(y){return y.name===n})[0];return x?x.id:null}).filter(Boolean);

var FXALIAS={JUMLAH:'SUM',RATA:'AVERAGE',AVG:'AVERAGE',JIKA:'IF',GABUNG:'CONCAT',HARIINI:'TODAY',BULATKAN:'ROUND',MAKS:'MAX',DAN:'AND',ATAU:'OR',PANJANG:'LEN',SELISIH:'DAYS'};
function fxTok(s){
  var o=[],i=0,m,c;
  while(i<s.length){

    if(c==='{'){var j=s.indexOf('}',i);if(j<0)throw new Error('Tanda } belum ditutup');o.push({t:'ref',v:s.slice(i+1,j).trim()});i=j+1;continue}

    m=/^(\d+(\.\d+)?|\.\d+)/.exec(s.slice(i));if(m){o.push({t:'num',v:parseFloat(m[1])});i+=m[0].length;continue}
    m=/^[A-Za-z_][A-Za-z0-9_]*/.exec(s.slice(i));if(m){o.push({t:'id',v:m[0].toUpperCase()});i+=m[0].length;continue}
    m=/^(<=|>=|!=|<>)/.exec(s.slice(i));if(m){o.push({t:'op',v:m[0]==='<>'?'!=':m[0]});i+=2;continue}
    if('+-*/^()<>=,&%'.indexOf(c)>=0){o.push({t:'op',v:c});i++;continue}
    throw new Error('Karakter tidak dikenal: '+c);

function fxEval(t,r,src,curId){
  var tk=fxTok(src),p=0;

  function pw(){var a=post();if(op('^')){p++;var b=un();return Math.pow(num(a),num(b))}return a}
  function post(){var a=prim();while(op('%')){p++;a=num(a)/100}return a}
  function prim(){
    var x=tk[p++];
    if(!x)throw new Error('Rumus belum lengkap');
    if(x.t==='num'||x.t==='str')return x.v;
    if(x.t==='ref')return fref(t,refField(x.v),r);
    if(x.t==='op'&&x.v==='('){var v=expr();if(!op(')'))throw new Error('Tanda ) hilang');p++;return v}
    if(x.t==='id'){
      if(!op('('))throw new Error('Tulis '+x.v+'(...) atau rujuk kolom dengan {Nama Kolom}');
      p++;var args=[];
      if(op(')')){p++}else{for(;;){args.push(expr());if(op(',')){p++;continue}if(op(')')){p++;break}throw new Error('Tanda , atau ) diharapkan')}}
      return call(x.v,args);
    }
    throw new Error('Tanda tidak terduga dalam rumus');
  }
  if(!tk.length)return '';
  var res=expr();
  if(p<tk.length)throw new Error('Ada bagian rumus yang tidak dikenali');
  return res;
}
function fxRun(t,r,src,curId){
  var res=fxEval(t,r,src,curId);
  if(typeof res==='number'){if(isNaN(res))return '#ERROR';if(!isFinite(res))return '#DIV/0!';return Math.round(res*1e10)/1e10}
  if(typeof res==='boolean')return res?'Ya':'Tidak';
  return res==null?'':String(res);
}
function recalc(t,r){
  t.fields.forEach(function(f){
    if(f.type!=='formula')return;
    var res;try{res=f.formula?fxRun(t,r,f.formula,f.id):''}catch(e){res='#ERROR'}
    r.v[f.id]=res;
    if(typeof res==='number')f.out='number';else if(res!==''&&!/^#/.test(res))f.out='text';
  });
}

  return '<div class="bcard"><a class="bmain" href="#base-'+b.id+'"><span class="tile" style="background:'+b.color+'">'+esc((b.name.trim().charAt(0)||'B').toUpperCase())+'</span><span class="btxt"><b>'+esc(b.name)+'</b><small>'+esc(w?w.name:'')+' · '+rel(b.opened)+'</small></span></a>'+

function listOrEmpty(list,emptyTitle,emptyText){

var DW={text:200,number:120,currency:150,date:140,select:160,check:90,email:210,phone:160,url:210,formula:160,link:240,attachment:240,created:180,modified:180,button:130,barcode:190};
var NOVAL=['empty','nempty','checked','unchecked'];
function newCfg(){return {hidden:[],filters:[],conj:'and',sorts:[],group:null,gc:{},color:null,rh:'s',widths:{}}}
function curView(t){
  if(!t.views||!t.views.length){
    t.views=[{id:uid(),name:'Semua catatan',cfg:newCfg()}];t.vi=0;
    if(t.sort){t.views[0].cfg.sorts=[{f:t.sort.f,dir:t.sort.dir}]}
    t.sort=null;
  }
  if(t.vi==null||!t.views[t.vi])t.vi=0;
  return t.views[t.vi];
}
function cfg(t){
  var c=curView(t).cfg,d=newCfg();
  Object.keys(d).forEach(function(k){if(c[k]==null)c[k]=d[k]});
  return c;
}
function visFields(t){var h=cfg(t).hidden;return t.fields.filter(function(f,i){return i===0||h.indexOf(f.id)<0})}
function dstr(ms){if(!ms)return '';var d=new Date(ms);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function opsFor(f){
  var ty=f.type;
  if(ty==='check')return [['checked','dicentang'],['unchecked','tidak dicentang']];
  if(isNumF(f))return [['eq','='],['ne','≠'],['gt','>'],['ge','≥'],['lt','<'],['le','≤'],['empty','kosong'],['nempty','tidak kosong']];
  if(ty==='date'||ty==='created'||ty==='modified')return [['is','adalah'],['before','sebelum'],['after','sesudah'],['empty','kosong'],['nempty','tidak kosong']];
  if(ty==='select')return [['is','adalah'],['nis','bukan'],['empty','kosong'],['nempty','tidak kosong']];
  if(ty==='attachment'||ty==='link')return [['empty','kosong'],['nempty','tidak kosong']];
  return [['has','mengandung'],['nhas','tidak mengandung'],['is','adalah'],['nis','bukan'],['empty','kosong'],['nempty','tidak kosong']];
}
function filterFields(t){return t.fields.filter(function(f){return f.type!=='button'})}
function fmatch(t,f,fl,r){
  var op=fl.op,val=String(fl.val==null?'':fl.val),raw=r.v[f.id],s=dv(t,f,r),empty,x,y,d;
  if(f.type==='check')return op==='checked'?!!raw:!raw;
  if(f.type==='created')empty=!r.ct;
  else if(f.type==='modified')empty=!r.mt;
  else if(f.type==='attachment'||f.type==='link')empty=!(Array.isArray(raw)&&raw.length);
  else empty=(s==='');
  if(op==='empty')return empty;
  if(op==='nempty')return !empty;
  if(isNumF(f)){
    x=parseFloat(raw);y=parseMoney(val);if(isNaN(y))return true;if(isNaN(x))return false;
    return op==='eq'?x===y:op==='ne'?x!==y:op==='gt'?x>y:op==='ge'?x>=y:op==='lt'?x<y:op==='le'?x<=y:true;
  }
  if(f.type==='date'||f.type==='created'||f.type==='modified'){
    d=f.type==='created'?dstr(r.ct):f.type==='modified'?dstr(r.mt):String(raw||'');
    if(!d)return false;
    return op==='is'?d===val:op==='before'?d<val:op==='after'?d>val:true;
  }
  if(f.type==='select')return op==='is'?raw===val:op==='nis'?raw!==val:true;
  x=s.toLowerCase();y=val.toLowerCase();
  return op==='has'?x.indexOf(y)>-1:op==='nhas'?x.indexOf(y)<0:op==='is'?x===y:op==='nis'?x!==y:true;
}
function activeFilters(t){
  return cfg(t).filters.filter(function(fl){return fld(t,fl.f)&&(NOVAL.indexOf(fl.op)>-1||String(fl.val==null?'':fl.val)!=='')});
}
function cmpVal(t,f,a,b){
  var x=a.v[f.id],y=b.v[f.id];
  if(f.type==='created')return (a.ct||0)-(b.ct||0);
  if(f.type==='modified')return (a.mt||0)-(b.mt||0);
  if(isNumF(f)){x=parseFloat(x);y=parseFloat(y);x=isNaN(x)?-Infinity:x;y=isNaN(y)?-Infinity:y;return x===y?0:(x<y?-1:1)}
  if(f.type==='check')return (x?1:0)-(y?1:0);
  return dv(t,f,a).localeCompare(dv(t,f,b),'id');
}
function rowsOf(t){
  var c=cfg(t),r=t.records.slice(),q=(t.q||'').trim().toLowerCase(),af=activeFilters(t);
  if(af.length){
    var fs=af.map(function(fl){return {fl:fl,f:fld(t,fl.f)}});
    r=r.filter(function(x){var m=function(o){return fmatch(t,o.f,o.fl,x)};return c.conj==='or'?fs.some(m):fs.every(m)});
  }
  if(q)r=r.filter(function(x){return t.fields.some(function(f){var raw=x.v[f.id];return dv(t,f,x).toLowerCase().indexOf(q)>-1||(typeof raw!=='object'&&String(raw==null?'':raw).toLowerCase().indexOf(q)>-1)})});
  var ss=c.sorts.map(function(s){return {f:fld(t,s.f),d:s.dir==='desc'?-1:1}}).filter(function(s){return s.f});
  if(ss.length)r.sort(function(a,b){for(var i=0;i<ss.length;i++){var v=cmpVal(t,ss[i].f,a,b)*ss[i].d;if(v)return v}return 0});
  return r;
}
function gkey(t,f,r){
  if(f.type==='check')return r.v[f.id]?'Dicentang':'Tidak dicentang';
  if(f.type==='created')return dstr(r.ct);
  if(f.type==='modified')return dstr(r.mt);
  return dv(t,f,r);
}
function gridGroups(t,rows){
  var c=cfg(t),f=c.group?fld(t,c.group):null;if(!f)return null;
  var map={},order=[];
  rows.forEach(function(r){var k=gkey(t,f,r),m='k:'+k;if(!map[m]){map[m]={key:k,label:k===''?'Kosong':k,rows:[]};order.push(map[m])}map[m].rows.push(r)});
  order.sort(function(a,b){
    if(a.key==='')return 1;if(b.key==='')return -1;
    if(f.type==='select')return f.options.indexOf(a.key)-f.options.indexOf(b.key);
    return cmpVal(t,f,a.rows[0],b.rows[0]);
  });

}

/* lampiran */
var attCtx=null,scanCtx=null;
function readImg(file,max,q,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',q));
    };
    img.onerror=function(){cb(null)};img.src=fr.result;
  };
  fr.onerror=function(){cb(null)};fr.readAsDataURL(file);
}
function addFiles(files){
  var b=curBase(),c=attCtx;if(!b||!c)return;
  var t=b.tables[b.tab],r=recOf(t,c.r),f=fld(t,c.f);if(!r||!f)return;
  var list=[].slice.call(files),added=[],i=0;
  if(!Array.isArray(r.v[f.id]))r.v[f.id]=[];
  function push(o){o.id=uid();r.v[f.id].push(o);added.push(o)}
  function finish(){
    if(!added.length)return;
    r.mt=Date.now();
    if(!save()){r.v[f.id]=r.v[f.id].filter(function(x){return added.indexOf(x)<0});save()}
    recalc(t,r);redrawCell(t,r,f);refreshRow(t,r);
  }
  (function next(){
    if(i>=list.length){finish();return}
    var file=list[i++];
    if(/^image\//.test(file.type)){
      readImg(file,900,.72,function(url){
        if(!url){toast('Gambar “'+file.name+'” tidak bisa dibaca.');next();return}
        push({name:file.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',size:Math.round(url.length*.75),url:url});next();
      });
    }else if(file.type==='application/pdf'||/^video\//.test(file.type)){
      if(file.size>1.5*1048576){toast('“'+file.name+'” terlalu besar. Batas versi demo 1,5 MB per file.');next();return}
      var fr=new FileReader();
      fr.onload=function(){push({name:file.name,type:file.type,size:file.size,url:fr.result});next()};
      fr.onerror=function(){next()};fr.readAsDataURL(file);
    }else{toast('Jenis file “'+file.name+'” belum didukung. Gunakan foto, PDF, atau video.');next()}
  })();
}
function blobUrl(d){
  var p=d.split(','),mime=(p[0].match(/:(.*?);/)||[])[1]||'',bin=atob(p[1]),arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr],{type:mime}));
}

function parseCSV(s){
  var rows=[],r=[],c='',q=false;
  for(var i=0;i<s.length;i++){var ch=s[i];
    if(q){if(ch==='"'){if(s[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','||ch===';'){r.push(c);c=''}
    else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}
    else if(ch!=='\r')c+=ch;
  }
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows.filter(function(x){return x.some(function(y){return y.trim()!==''})});
}
function importCSV(file){
  var rd=new FileReader();

    var fields=head.map(function(h,i){

      var num=vals.length>0&&vals.every(function(v){return v!==''&&!isNaN(Number(v))});
      return {n:h.trim()||('Kolom '+(i+1)),t:num?'number':'text'};
    });
    var data=body.map(function(r){return fields.map(function(f,i){return (r[i]||'').trim()})});
    var t=mkTable('Tabel 1',fields,data);
    var b={id:uid(),name:file.name.replace(/\.[^.]+$/,'')||'Impor CSV',wsId:D.workspaces[0].id,color:'#2B63C9',starred:false,view:'grid',opened:Date.now(),tab:0,tables:[t]};
    D.bases.push(b);save();toast('Berhasil mengimpor '+data.length+' catatan.');go('base-'+b.id);

  rd.readAsText(file);

      if(fid===excl)return true;

function numsOf(f,rs){var o=[];rs.forEach(function(r){var v=r.v[f.id],x=parseFloat(v);if(v!==''&&v!=null&&isFinite(x))o.push({r:r,x:x})});return o}
function ttl(t,r){var f=ofType(t,'text')[0]||t.fields.filter(function(x){return ['link','attachment','button'].indexOf(x.type)<0})[0],v=f?dv(t,f,r):'';return (v===''||v==null)?'Tanpa judul':String(v)}
function isFilled(f,r){if(f.type==='check'||f.type==='created'||f.type==='modified'||f.type==='button')return true;var v=r.v[f.id];if(Array.isArray(v))return v.length>0;return v!==''&&v!=null}
function qt(s,p){var i=(s.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)}
function stats(a){
  var n=a.length;if(!n)return null;
  var s=a.slice().sort(function(x,y){return x-y}),sum=0,v=0;a.forEach(function(x){sum+=x});
  var m=sum/n;a.forEach(function(x){v+=(x-m)*(x-m)});
  return {n:n,sum:sum,mean:m,med:qt(s,.5),min:s[0],max:s[n-1],sd:Math.sqrt(v/n),q1:qt(s,.25),q3:qt(s,.75)};
}
function pearson(xs,ys){
  var n=xs.length,mx=0,my=0,i;for(i=0;i<n;i++){mx+=xs[i];my+=ys[i]}mx/=n;my/=n;
  var sxy=0,sxx=0,syy=0;for(i=0;i<n;i++){var dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy}
  return sxx&&syy?sxy/Math.sqrt(sxx*syy):null;
}
function rlabel(r){var a=Math.abs(r);return a>=.7?'kuat':a>=.4?'sedang':'lemah'}
function nice(x,round){var e=Math.floor(Math.log10(x)),f=x/Math.pow(10,e),k=round?(f<1.5?1:f<3?2:f<7?5:10):(f<=1?1:f<=2?2:f<=5?5:10);return k*Math.pow(10,e)}
function scale(min,max,n){
  if(min===max){min-=1;max+=1}
  var range=nice(max-min,false),step=nice(range/(n-1),true),lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,t=[];
  for(var v=lo;v<=hi+step/2;v+=step)t.push(+v.toFixed(10));
  return {lo:lo,hi:hi,t:t};
}
function scaleInt(max){
  max=Math.max(1,max);var step=max<=4?1:Math.max(1,Math.round(nice(max/4,true))),hi=Math.ceil(max/step)*step,t=[];
  for(var v=0;v<=hi;v+=step)t.push(v);
  return {lo:0,hi:hi,t:t};
}

function colorFor(f,k){
  if(k==='(kosong)')return 'var(--c-oth)';
  if(f.type==='select'){var j=f.options.indexOf(k);return j<0?'var(--c-oth)':CC[j%8]}
  if(f.type==='check')return k==='Ya'?CC[2]:'var(--c-oth)';
  return 'var(--accent)';
}
function cats(f,rs){
  var order=[],m=Object.create(null);
  if(f.type==='select')f.options.forEach(function(o){m[o]=0;order.push(o)});
  if(f.type==='check'){m.Ya=0;m.Tidak=0;order=['Ya','Tidak']}
  rs.forEach(function(r){var k=keyOf(f,r);if(!(k in m)){m[k]=0;order.push(k)}m[k]++});
  var out=order.map(function(k){return {k:k,n:m[k],c:colorFor(f,k)}});
  if(f.type==='text'){out.sort(function(a,b){return b.n-a.n});out=out.slice(0,10)}
  return out.filter(function(c){return c.n>0||AN.flt[f.id]===c.k});
}

function histo(vals){
  var st=stats(vals),n=vals.length;
  if(st.min===st.max)return [{lo:st.min,hi:st.max,v:n}];

  return bins;
}

function groupRows(t,f,mf){

  if(el.id==='bname'){var b=curBase();if(b){b.name=el.value.trim()||'Base tanpa nama';save()}}
  if(el.id==='csvin'&&el.files&&el.files[0]){importCSV(el.files[0]);el.value=''}
  if(el.id==='an-base'){AN.bid=el.value;AN.tid=null;$('#main').innerHTML=mainHTML('analisis')}
  if(el.id==='an-table'){AN.tid=el.value;var ab=anBase(),at=ab&&ab.tables.filter(function(x){return x.id===AN.tid})[0];if(at)anDefaults(at);$('#main').innerHTML=mainHTML('analisis')}
  if(el.classList&&el.classList.contains('an-sel')){AN[el.dataset.k]=el.value;redrawAn()}
  if(el.id==='attin'){if(el.files&&el.files.length)addFiles(el.files);el.value=''}
  if(el.id==='scanin'&&el.files&&el.files[0]){var sm=$('#scanmsg');if(sm)sm.textContent='Membaca kode batang…';decodeBarcode(el.files[0],function(code){if(code)scanDone(code);else{var m2=$('#scanmsg');if(m2)m2.textContent='Kode tidak terbaca. Coba foto lebih dekat dan terang, atau ketik kode secara manual.'}});el.value=''}
});
document.addEventListener('submit',function(e){
  var f=e.target;e.preventDefault();
  if(f.id==='authform')return submitAuth(f);
  if(f.id==='tplform'){
    var k=f.tpl.value,b=buildBase(k,f.name.value.trim(),f.ws.value);D.bases.push(b);save();closeModal();go('base-'+b.id);return;
  }
  if(f.id==='wsform'){
    var n=f.name.value.trim();if(!n){toast('Isi nama workspace.');return}
    D.workspaces.push({id:uid(),name:n});save();closeModal();go('workspace');return;
  }
  if(f.id==='fieldform')return submitField(f);
  if(f.id==='pickform')return submitPick(f);
  if(f.id==='scanform')return submitScan(f);
  if(f.id==='tabform'){var tb2=curBase(),ti=+f.dataset.i;if(tb2&&tb2.tables[ti]){var nn=f.name.value.trim();if(!nn){toast('Isi nama tabel.');return}tb2.tables[ti].name=nn;save();closeModal();$('#main').innerHTML=baseView(tb2)}return}
  if(f.id==='renameform'){var rb=curBase();if(rb){var rv=curView(rb.tables[rb.tab]);rv.name=f.name.value.trim()||rv.name;save();closeModal();drawTools()}return}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if($('.ovl'))closeModal();else if(POP)closePop();else if(DR)closeDrawer()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains('ovl')){closeModal();return}
  if(POP&&t.closest&&!t.closest('#pop')&&!t.closest('[data-act="pop"]'))closePop();
  if(menuOpen&&!t.closest('.menu')&&!t.closest('.avatar')){menuOpen=false;var m=$('#menu');if(m)m.hidden=true}
  var a=t.closest('[data-act]');if(!a)return;
  var act=a.dataset.act,b=curBase();
  switch(act){
    case 'scroll':var el=document.getElementById(a.dataset.id);if(el)el.scrollIntoView({behavior:'smooth'});break;
    case 'demo':demoLogin();break;
    case 'theme':
      var cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
      var nx=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);st.set(TK,nx);break;
    case 'bell':toast('Tidak ada notifikasi baru.');break;
    case 'menu':menuOpen=!menuOpen;$('#menu').hidden=!menuOpen;break;
    case 'logout':logout();break;
    case 'closebanner':D.banner=false;save();drawMain();break;
    case 'plans':pendingScroll='harga';go('');break;
    case 'star':
      var sb=D.bases.filter(function(x){return x.id===a.dataset.id})[0];
      if(sb){sb.starred=!sb.starred;save();if(b)document.getElementById('root').querySelector('.bhead').outerHTML=baseView(b).split('<div class="tabs">')[0];else drawMain()}
      break;
    case 'tplmodal':tplModal(D.workspaces[0].id);break;
    case 'addbase':tplModal(a.dataset.id);break;
    case 'blank':var nb=buildBase('kosong','Base tanpa nama',D.workspaces[0].id);D.bases.push(nb);save();go('base-'+nb.id);break;
    case 'csv':$('#csvin').click();break;
    case 'newws':modal('<h2>Buat workspace</h2><form id="wsform"><label class="lbl">Nama workspace<input name="name" placeholder="Contoh: Tim Pemasaran"></label><div class="mactions"><button type="button" class="btn" data-act="closemodal">Batal</button><button class="btn primary" type="submit">Buat workspace</button></div></form>');break;
    case 'closemodal':closeModal();break;
    case 'flt':var fid=a.dataset.f,fval=a.dataset.v;if(AN.flt[fid]===fval)delete AN.flt[fid];else AN.flt[fid]=fval;redrawAn();break;
    case 'clrflt':AN.flt={};redrawAn();break;
    case 'colmenu':colMenu(a.dataset.f);break;
    case 'editfield':closeModal();fieldModal(a.dataset.f);break;
    case 'sortfield':if(b){cfg(b.tables[b.tab]).sorts=[{f:a.dataset.f,dir:a.dataset.dir}];closeModal();applyCfg()}break;
    case 'hidefield':if(b){var hc=cfg(b.tables[b.tab]);if(hc.hidden.indexOf(a.dataset.f)<0)hc.hidden.push(a.dataset.f);closeModal();applyCfg()}break;
    case 'groupfield':if(b){var gc=cfg(b.tables[b.tab]);gc.group=a.dataset.f;gc.gc={};closeModal();applyCfg()}break;
    case 'side':toggleSide();break;
    case 'tabren':tabRenameModal(+a.dataset.i);break;
    case 'pop':togglePop(a.dataset.k);break;
    case 'popadd':popAdd(a.dataset.k);break;
    case 'popdel':popDel(a.dataset.k,+a.dataset.i);break;
    case 'popclr':popClr(a.dataset.k);break;
    case 'popall':popAll(a.dataset.m);break;
    case 'viewsel':viewSel(+a.dataset.i);break;
    case 'viewnew':viewNew();break;
    case 'viewdup':viewDup();break;
    case 'viewren':viewRenameModal();break;
    case 'viewdel':viewDelModal();break;
    case 'confirmvdel':doViewDel();break;
    case 'rsel':if(b){if(a.checked)SEL[a.dataset.r]=1;else delete SEL[a.dataset.r];var rtr=a.closest('tr');if(rtr)rtr.classList.toggle('sel',a.checked);drawTools();var sa=$('input[data-act="rselall"]');if(sa)sa.checked=rowsOf(b.tables[b.tab]).every(function(x){return SEL[x.id]})}break;
    case 'rselall':if(b){var rr=rowsOf(b.tables[b.tab]);SEL={};if(a.checked)rr.forEach(function(x){SEL[x.id]=1});drawContent();drawTools()}break;
    case 'selclear':SEL={};drawContent();drawTools();break;
    case 'seldel':selDelModal();break;
    case 'confirmseldel':doSelDel();break;
    case 'expand':openDrawer(a.dataset.r);break;
    case 'dclose':closeDrawer();break;
    case 'dprev':stepDrawer(-1);break;
    case 'dnext':stepDrawer(1);break;
    case 'drawdel':if(DR)selDelModal([DR]);break;
    case 'gtoggle':if(b){var gcf=cfg(b.tables[b.tab]),gk='k:'+a.dataset.g;if(gcf.gc[gk])delete gcf.gc[gk];else gcf.gc[gk]=1;save();drawContent()}break;
    case 'delfield':delFieldModal(a.dataset.f);break;
    case 'confirmdelfield':doDelField(a.dataset.f);break;
    case 'pick':pickModal(a.dataset.r,a.dataset.f);break;
    case 'attach':attCtx={r:a.dataset.r,f:a.dataset.f};$('#attin').click();break;
    case 'openatt':attModal(a.dataset.r,a.dataset.f,a.dataset.a);break;
    case 'delatt':delAtt(a.dataset.r,a.dataset.f,a.dataset.a);break;
    case 'btn':runBtn(a.dataset.r,a.dataset.f);break;
    case 'scan':scanModal(a.dataset.r,a.dataset.f);break;
    case 'tm':AN.tm=a.dataset.v;redrawAn();break;
    case 'analyze':if(b){var bt=b.tables[b.tab];AN.bid=b.id;AN.tid=bt.id;anDefaults(bt);go('analisis')}break;
    case 'openbase':var ob=anBase();if(ob){var oi=ob.tables.map(function(x){return x.id}).indexOf(AN.tid);ob.tab=oi<0?0:oi;save();go('base-'+ob.id)}break;
    case 'tab':if(b&&+a.dataset.i!==b.tab){b.tab=+a.dataset.i;SEL={};closePop();closeDrawer();save();$('#main').innerHTML=baseView(b)}break;
    case 'addtable':
      if(b){b.tables.push(mkTable('Tabel '+(b.tables.length+1),[{n:'Nama',t:'text'},{n:'Catatan',t:'text'}],[['',''],['','']]));b.tab=b.tables.length-1;SEL={};closePop();closeDrawer();save();$('#main').innerHTML=baseView(b)}break;
    case 'view':if(b){b.view=a.dataset.v;closePop();save();drawTools();drawContent()}break;
    case 'sort':
      if(b){var tb=b.tables[b.tab];
        var sc2=cfg(tb),ss=sc2.sorts;
        if(ss.length===1&&ss[0].f===a.dataset.f){if(ss[0].dir==='asc')ss[0].dir='desc';else sc2.sorts=[]}else sc2.sorts=[{f:a.dataset.f,dir:'asc'}];
        applyCfg()}break;
    case 'addfield':fieldModal();break;
    case 'addrow':
      if(b){var t2=b.tables[b.tab],v={},sf=t2.fields.filter(function(x){return x.type==='select'})[0];
        t2.fields.forEach(function(f){v[f.id]=blankVal(f.type)});
        if(a.dataset.val!==undefined&&sf)v[sf.id]=a.dataset.val;
        var nr={id:uid(),v:v,ct:Date.now(),mt:Date.now()};recalc(t2,nr);t2.records.push(nr);save();drawContent();
        var ntr=document.querySelector('tr[data-row="'+nr.id+'"]');
        if(ntr){ntr.scrollIntoView({block:'nearest'});var ins=ntr.querySelector('input[type=text],textarea');if(ins)ins.focus()}
        else if(b.view==='grid')toast('Catatan ditambahkan, tetapi tidak tampil karena filter atau pencarian.');}
      break;
    case 'delrow':
      if(b){var t3=b.tables[b.tab];t3.records=t3.records.filter(function(x){return x.id!==a.dataset.r});save();drawContent()}break;
    case 'delbase':
      if(b)modal('<h2>Hapus base?</h2><p class="muted">“'+esc(b.name)+'” dan seluruh isinya akan dihapus. Tindakan ini tidak dapat dibatalkan.</p><div class="mactions"><button class="btn" data-act="closemodal">Batal</button><button class="btn primary" data-act="confirmdel">Hapus</button></div>');break;
    case 'confirmdel':
      if(b){D.bases=D.bases.filter(function(x){return x.id!==b.id});save();closeModal();toast('Base dihapus.');go('beranda')}break;
  }
});
document.addEventListener('focusin',function(e){var el=e.target;if(el.dataset&&el.dataset.cur){el.value=String(el.dataset.raw||'').replace('.',',');try{el.select()}catch(x){}}});
document.addEventListener('focusout',function(e){var el=e.target;if(el.dataset&&el.dataset.cur){var n=parseMoney(el.value);el.value=isFinite(n)?'Rp '+NF.format(n):''}});
document.addEventListener('pointerdown',function(e){
  var h=e.target.closest&&e.target.closest('.rz');if(!h)return;e.preventDefault();
  var b=curBase();if(!b)return;var col=document.querySelector('col[data-f="'+h.dataset.f+'"]'),tbl=$('table.grid');if(!col||!tbl)return;
  RZ={f:h.dataset.f,x:e.clientX,w:col.getBoundingClientRect().width,tot:tbl.getBoundingClientRect().width,col:col,tbl:tbl,t:b.tables[b.tab],nw:0};
  document.body.classList.add('rzing');
});
document.addEventListener('pointermove',function(e){if(!RZ)return;var w=Math.max(70,Math.round(RZ.w+e.clientX-RZ.x));RZ.nw=w;RZ.col.style.width=w+'px';RZ.tbl.style.width=(RZ.tot+w-RZ.w)+'px'});
function endRz(){if(!RZ)return;var r=RZ;RZ=null;document.body.classList.remove('rzing');if(r.nw){cfg(r.t).widths[r.f]=r.nw;save()}}
document.addEventListener('pointerup',endRz);document.addEventListener('pointercancel',endRz);
window.addEventListener('resize',placePop);
document.addEventListener('scroll',placePop,true);
document.addEventListener('dblclick',function(e){var tt=e.target.closest&&e.target.closest('.tab[data-i]');if(tt)tabRenameModal(+tt.dataset.i)});
window.addEventListener('hashchange',route);
route();
})();
</script>
