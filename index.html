  --k0:#95A2B4;--k1:#E3A94A;--k2:#3FC79C;--k3:#6B9BF2;--k4:#EE7C95;--k5:#A786F0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
  --c1:#3A86FF;--c2:#E65F1F;--c3:#0DA070;--c4:#B87D00;--c5:#DE4C92;--c6:#8A6CF0;--c7:#10A2C4;--c8:#E84848;--grid:#2c2c2a;--axis:#383835;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--font-d);letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 22px;font-size:15.5px;border-radius:12px}
.iconbtn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;font-size:17px;line-height:1}
.iconbtn:hover{background:var(--accent-soft)}
.brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-d);font-weight:700;font-size:21px;text-decoration:none;letter-spacing:-.02em}

/* Landing */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
.nav .links{display:flex;gap:6px;margin-right:auto;margin-left:12px}
.nav .actions{display:flex;gap:8px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;align-items:center;padding:56px 0 64px}
.hero h1{font-size:clamp(2.3rem,5.2vw,3.7rem)}
.hero mark{background:linear-gradient(transparent 58%,var(--hi) 58% 92%,transparent 92%);color:inherit;padding:0 .08em}
.hero .lead{font-size:1.15rem;color:var(--muted);margin:20px 0 28px;max-width:34em}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero .fine{margin-top:16px;font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.demo{padding:14px;min-width:0}
.demohead{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 12px;gap:8px}
.demohead b{font-family:var(--font-d);font-size:1.05rem}
.demotabs{display:flex;gap:6px;padding:0 4px 12px;flex-wrap:wrap}
.pill{padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--line);color:var(--muted)}
.pill.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.section{padding:56px 0;border-top:1px solid var(--line)}
.section h2{font-size:clamp(1.7rem,3.4vw,2.4rem);max-width:18em}
.section .sub{color:var(--muted);margin-top:12px;max-width:38em}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:32px 36px;margin-top:36px}
.feat{padding-top:0}
.fh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.fic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.feat h3{font-size:1.15rem}
.feat p{color:var(--muted)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:32px;align-items:stretch}
.plan{padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.plan.pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.plan h3{font-size:1.2rem}
.price{font-family:var(--font-d);font-size:2rem;font-weight:700;letter-spacing:-.02em}
.price small{font-family:var(--font-b);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;color:var(--muted);flex:1}
.plan li::before{content:"✓";color:var(--accent);font-weight:700;margin-right:8px}
.cta-end{margin:24px 0 8px;padding:40px 28px;text-align:center;display:grid;gap:18px;justify-items:center}
.cta-end h2{font-size:clamp(1.6rem,3.2vw,2.2rem)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:28px 0 40px;color:var(--muted);font-size:13.5px;border-top:1px solid var(--line);margin-top:40px}

/* Auth */
.auth{min-height:100vh;display:grid;align-content:center;justify-items:center;gap:24px;padding:40px 0}
.authcard{width:100%;max-width:420px;padding:30px 28px;display:grid;gap:18px}
.authcard h1{font-size:1.7rem}
.field{display:grid;gap:6px;font-weight:600;font-size:13.5px}
.field input,.lbl input,.lbl select{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:400;font-size:15px;width:100%}
.field input:focus,.lbl input:focus,.lbl select:focus{border-color:var(--accent)}
.err{color:var(--k4);font-weight:500;font-size:13px;min-height:1px}
.authcard form{display:grid;gap:14px}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.sep::before,.sep::after{content:"";height:1px;background:var(--line);flex:1}

/* App */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.search{flex:1;max-width:460px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.search input{border:0;background:transparent;padding:8px 0;flex:1;min-width:0;outline:0}
.search:focus-within{border-color:var(--accent)}
.tright{display:flex;align-items:center;gap:4px;position:relative}
.avatar{width:34px;height:34px;border-radius:50%;border:0;background:var(--k5);color:#fff;font-weight:700;cursor:pointer}
.menu{position:absolute;right:0;top:44px;width:240px;padding:12px;display:grid;gap:10px;z-index:25}
.menu small{display:block;color:var(--muted);overflow-wrap:anywhere}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;min-height:calc(100vh - 60px)}
.side{padding:18px 14px 18px 0;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.nav-i{display:block;padding:9px 12px;border-radius:9px;text-decoration:none;font-weight:600}
.nav-i:hover{background:var(--accent-soft)}
.nav-i.on{background:var(--accent-soft);color:var(--accent)}
.wshead{display:flex;align-items:center;justify-content:space-between;gap:4px}
.wshead .nav-i{flex:1}
.ws-i{display:block;padding:6px 12px 6px 24px;color:var(--muted);text-decoration:none;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-i:hover{color:var(--fg)}
.main{padding:28px 0 56px 28px;min-width:0}
.main h1{font-size:2rem;margin-bottom:20px}
.banner{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:18px 20px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--line);margin-bottom:22px}
.banner b{font-family:var(--font-d);font-size:1.1rem}
.banner .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:30px}
.start{padding:16px 18px;text-align:left;cursor:pointer;display:grid;gap:4px;font:inherit;color:inherit}
.start b{font-family:var(--font-d);font-size:1.05rem}
.start span{color:var(--muted);font-size:14px}
.start:hover{border-color:var(--accent)}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;gap:10px}
.sechead h2{font-size:1.15rem}
.blist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.bcard{display:flex;align-items:center;gap:6px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.bcard:hover{border-color:var(--accent)}
.bmain{display:flex;align-items:center;gap:12px;text-decoration:none;flex:1;min-width:0}
.tile{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--font-d);font-weight:700;font-size:1.2rem;flex:none}
.btxt{display:grid;min-width:0}
.btxt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btxt small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:44px 20px;text-align:center;display:grid;gap:8px;justify-items:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.empty h2{color:var(--fg);font-size:1.2rem}
.wscard{padding:18px;margin-bottom:16px;display:grid;gap:14px}
.wscard .sechead{margin:0}

/* Base */
.bhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bname{font-family:var(--font-d);font-weight:700;font-size:1.5rem;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;min-width:0;flex:1;letter-spacing:-.02em}
.bname:hover,.bname:focus{border-color:var(--line);background:var(--surface)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:9px 14px;border:0;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab.add{font-weight:500}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{padding:6px 12px;border:0;background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.tools .grow{flex:1}
.tools input[type=search]{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);min-width:0;width:200px}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:640px}
.grid th{position:sticky;top:0;background:var(--bg);text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;user-select:none}
.grid th[data-act]{cursor:pointer}
.grid th[data-act]:hover{color:var(--fg)}
.grid th i{font-style:normal;font-family:var(--mono);font-size:11px;margin-right:6px;padding:1px 5px;border-radius:4px;background:var(--line)}
.grid td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:38px;min-width:130px}
.grid td.rn,.grid th.rn{min-width:46px;width:46px;text-align:center;color:var(--muted);font-size:12px;position:relative}
.grid tr:last-child td{border-bottom:0}
.grid td input[type=text],.grid td input[type=number],.grid td input[type=date]{width:100%;height:38px;border:0;background:transparent;padding:0 10px;outline:0;font-size:14px}
.grid td input:focus{background:var(--accent-soft)}
.grid td input[type=checkbox]{width:18px;height:18px;margin:10px;accent-color:var(--accent);cursor:pointer}
.grid td.cs{padding:0 8px}
.grid .addcol{min-width:48px;width:48px;text-align:center}
.grid .addcol button{border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--muted)}
.chip,.chipsel{--k:var(--k0);padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--k);background:color-mix(in srgb,var(--k) 15%,var(--surface));display:inline-block}
.chipsel{border:0;appearance:none;-webkit-appearance:none;cursor:pointer;padding:4px 12px;min-width:84px;text-align:left}
.chipsel.empty{--k:var(--muted);background:transparent;border:1px dashed var(--line);padding:3px 11px;border-radius:999px}
.chipsel option{color:var(--fg);background:var(--surface)}
.gfoot{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;color:var(--muted);font-size:13px;gap:8px;flex-wrap:wrap}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.kcol{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.khead{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 4px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.kcard b{font-weight:600;overflow-wrap:anywhere}
.kcard small{color:var(--muted);overflow-wrap:anywhere}
.movesel{padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;justify-self:start;max-width:100%}
.kadd{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px;color:var(--muted);cursor:pointer;font-weight:500}
.kadd:hover{color:var(--fg);border-color:var(--muted)}

/* Analisis */
.anhead{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 18px}
.sl{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.sl select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:14px;font-weight:400;max-width:100%}
.sl select:focus{border-color:var(--accent)}
.fchips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.fchip{border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px;min-width:0;align-content:start}
.kl{font-size:13px;color:var(--muted)}
.kv{font-family:var(--font-d);font-size:1.7rem;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.ks{font-size:12.5px;color:var(--muted)}
.ash{font-size:1.25rem;margin:32px 0 4px}
.asub{color:var(--muted);font-size:14px;margin:0 0 14px}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.ac{padding:18px;min-width:0;display:grid;gap:12px;align-content:start}
.ac h3{font-size:1.05rem}
.ac .ah{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-end}
.ac .ctl{display:flex;gap:10px;flex-wrap:wrap}
.ins{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.ins li{position:relative;padding-left:18px;line-height:1.5}
.ins li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:2px;background:var(--accent)}
.dw{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dw svg{flex:none;max-width:100%;height:auto}
.dn{font-family:var(--font-d);font-size:26px;font-weight:700;fill:var(--fg)}
.ds{font-size:11px;fill:var(--muted)}
.dseg{cursor:pointer;transition:opacity .15s}
.dseg.dim{opacity:.3}
.dseg:hover{opacity:.85}
.lg{list-style:none;margin:0;padding:0;display:grid;gap:2px;flex:1;min-width:150px}
.lgi{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.lgi:hover,.lgi.on{background:var(--accent-soft)}
.lgi i{width:10px;height:10px;border-radius:3px}
.lgn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgv{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.hb{display:grid;gap:4px}
.hr{display:grid;grid-template-columns:minmax(64px,120px) minmax(0,1fr);gap:10px;align-items:center;padding:4px 6px;border-radius:8px}
.hr[data-act]{cursor:pointer}
.hr[data-act]:hover{background:var(--accent-soft)}
.hr.dim{opacity:.4}
.hl{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hz{position:relative;height:18px;margin-right:84px}
.hf{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.hv{position:absolute;top:50%;transform:translateY(-50%);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px 14px}
.sg div{display:grid;gap:1px}
.sg small{color:var(--muted);font-size:12px}
.sg b{font-size:15px;font-weight:600}
.cp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;padding-top:16px}
.cy{position:relative;height:160px;min-width:24px}
.cy span{position:absolute;right:0;transform:translateY(50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cb{position:relative;height:160px;border-bottom:1px solid var(--axis)}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.cw{position:absolute;inset:0;display:flex;gap:2px}
.cslot{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:4px 4px 0 0}
.cslot:hover,.cslot:focus-visible{background:var(--accent-soft)}
.bar{position:relative;display:block;width:min(100%,28px);background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.bar em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;padding-bottom:2px;white-space:nowrap}
.cx{display:flex;gap:2px;margin-top:6px;height:16px}
.cx span{flex:1;min-width:0;display:flex;justify-content:center}
.cx b{font-weight:400;font-size:11px;color:var(--muted);white-space:nowrap}
.sv{width:100%;max-width:560px;height:auto;display:block}
.sv text{fill:var(--muted);font-size:11px}
.sv .gl2{stroke:var(--grid);stroke-width:1}
.sv .ax2{stroke:var(--axis);stroke-width:1}
.sv .trend{stroke:var(--muted);stroke-width:2;fill:none;stroke-linecap:round}
.sv circle.pt{fill:var(--accent);stroke:var(--surface);stroke-width:2;cursor:default}
.dl{list-style:none;margin:0;padding:0}
.dl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:10px 0;border-top:1px solid var(--line)}
.dl li:first-child{border-top:0}
.dl small{color:var(--muted)}
.dl .st{display:inline-flex;gap:7px;align-items:center;font-size:13px;grid-row:1/3;grid-column:2;white-space:nowrap}
.st i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tv summary{cursor:pointer;color:var(--muted);font-size:13px;width:max-content}
.tvw{overflow-x:auto;margin-top:8px}
.tvw table{border-collapse:collapse;width:100%;font-size:13.5px}
.tvw th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tvw td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tvw.prof table{min-width:620px}
.fillbar{height:6px;border-radius:3px;background:var(--line);min-width:70px;margin-bottom:3px}
.fillbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ti{font-style:normal;font-family:var(--mono);font-size:11px;margin-right:7px;padding:1px 5px;border-radius:4px;background:var(--line)}

.tab-ed:hover{background:var(--accent-soft);color:var(--fg)}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tgrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.tcard h3{display:flex;align-items:center;gap:8px}
.tcard .sw{width:12px;height:12px;border-radius:3px;flex:none}
.tcs{display:flex;gap:6px;flex-wrap:wrap}
.tcn{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.tcn span{color:var(--muted)}

.tile svg{display:block}
.tile.sm{width:34px;height:34px;border-radius:9px;font-size:1rem}
.tile.big{width:64px;height:64px;border-radius:16px;font-size:1.8rem}
.tile.big svg{width:30px;height:30px}
.tilebtn{border:0;background:transparent;padding:0;cursor:pointer;border-radius:10px;display:inline-flex}
.tilebtn:hover .tile{box-shadow:0 0 0 3px var(--accent-soft)}
.bipv{display:flex;align-items:center;gap:14px;font-family:var(--font-d);font-size:1.1rem}
.bis{font-weight:700;font-size:13.5px;margin-bottom:8px}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.igb{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.igb:hover{border-color:var(--accent)}
.igb.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:8px}
.cgb{aspect-ratio:1;width:100%;border-radius:50%;border:0;cursor:pointer;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;padding:0}
.cgb.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg)}

/* logo Worktoday */
.brand{display:inline-flex;align-items:center}
.wm,.wi{display:block;width:auto}
.wm{height:38px}.wi{height:34px}
.wi,.wmd{display:none}
.auth .wm{height:52px}
.land .navin .wm{height:44px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wml{display:none}:root:not([data-theme="light"]) .wmd{display:block}}
:root[data-theme="dark"] .wml{display:none}
:root[data-theme="dark"] .wmd{display:block}
@media (max-width:560px){
  .top .wm{display:none!important}
  .top .wil{display:block}
}
@media (max-width:560px) and (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top .wil{display:none}:root:not([data-theme="light"]) .top .wid{display:block}}
@media (max-width:560px){:root[data-theme="dark"] .top .wil{display:none}:root[data-theme="dark"] .top .wid{display:block}}

/* galeri bergerak */
.show{overflow:hidden;padding-bottom:clamp(40px,6vw,80px)}
.showhead{margin-bottom:clamp(24px,4vw,48px)}
.mq{position:relative;overflow:hidden;padding:18px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.mqt{display:flex;gap:clamp(16px,2vw,32px);width:max-content;animation:mqL 60s linear infinite;will-change:transform}
.mq.rev .mqt{animation-name:mqR;animation-duration:75s}
.mq:hover .mqt{animation-play-state:paused}
@keyframes mqL{to{transform:translateX(-50%)}}
@keyframes mqR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.sc{margin:0;flex:none;height:clamp(190px,24vw,400px);aspect-ratio:var(--ar);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;position:relative;transition:transform .35s ease,box-shadow .35s ease}
.sc:nth-child(even){margin-top:clamp(12px,2vw,32px);margin-bottom:calc(-1*clamp(12px,2vw,32px))}
.mq.rev .sc:nth-child(even){margin-top:0;margin-bottom:0}
.mq.rev .sc:nth-child(odd){margin-top:clamp(12px,2vw,32px);margin-bottom:calc(-1*clamp(12px,2vw,32px))}
.sc:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 30px 60px -24px rgba(10,30,70,.4),var(--shadow)}
.sc img{display:block;width:100%;height:100%;object-fit:cover;object-position:top left}
.sc figcaption{position:absolute;left:12px;bottom:12px;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--fg);font-size:12.5px;font-weight:600;border:1px solid var(--line);backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:reduce){
  .mq{overflow-x:auto;-webkit-mask-image:none;mask-image:none}
  .mqt{animation:none!important}
  .mq.rev{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

function demoStart(){
  var root=document.getElementById('demo');if(!root)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var tok=++DEMO,alive=function(){return tok===DEMO&&document.body.contains(root)};
  var cur=root.querySelector('.dm-cur'),tb=root.querySelector('#dm-tb'),pop=root.querySelector('.dm-pop'),sav=root.querySelector('.dm-sav'),gv=root.querySelector('#dm-grid'),kv=root.querySelector('#dm-kan'),pg=root.querySelector('#dm-pg'),pk=root.querySelector('#dm-pk'),sb=root.querySelector('#dm-sort');
  var rows=demoRows();
  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
  async function w(ms){await sleep(ms);while(document.hidden&&alive())await sleep(300);if(!alive())throw 0}
  var pos=function(el,fx,fy){var rr=root.getBoundingClientRect(),r=el.getBoundingClientRect();return [r.left-rr.left+r.width*fx,r.top-rr.top+r.height*fy]};
  async function mv(el,fx,fy,ms){if(!el||!el.offsetParent)return;var p=pos(el,fx==null?.5:fx,fy==null?.5:fy);cur.style.transform='translate('+p[0]+'px,'+p[1]+'px)';await w(ms||950)}
  async function clk(){cur.classList.add('click');await w(170);cur.classList.remove('click');await w(130)}
  async function type(el,txt){if(!el)return;el.textContent='';el.classList.add('caret');for(var i=0;i<txt.length;i++){el.textContent=txt.slice(0,i+1);await w(55)}el.classList.remove('caret');await w(250)}
  var render=function(){tb.innerHTML=dmGrid(rows)};
  var q=function(id,c){var tr=tb.querySelector('tr[data-k="'+id+'"]');return tr?tr.querySelector(c):null};
  function flip(fn){
    var m={};tb.querySelectorAll('tr').forEach(function(tr){m[tr.dataset.k]=tr.getBoundingClientRect().top});fn();
    tb.querySelectorAll('tr').forEach(function(tr){var o=m[tr.dataset.k];if(o==null)return;var dy=o-tr.getBoundingClientRect().top;if(!dy)return;tr.style.transition='none';tr.style.transform='translateY('+dy+'px)';tr.getBoundingClientRect();tr.style.transition='transform .7s cubic-bezier(.4,0,.2,1)';tr.style.transform=''});
  }
  function buildKan(drop){
    kv.innerHTML=SN.map(function(n,k){var it=rows.filter(function(r){return r.s===k});
      return '<div class="kcol2" data-k="'+k+'"><div class="kh">'+chip(n,k)+'<span class="muted">'+it.length+'</span></div>'+it.map(function(r){return '<div class="kc'+(drop===r.id?' drop':'')+'" data-k="'+r.id+'"><b>'+esc(r.n)+'</b><small>'+esc(r.a)+'</small></div>'}).join('')+'</div>'}).join('');
  }
  function reset(){
    rows=demoRows();render();gv.hidden=false;kv.hidden=true;pg.classList.add('on');pk.classList.remove('on');
    sb.classList.remove('act');sb.innerHTML='Urutkan';pop.hidden=true;sav.textContent='Tersimpan';sav.classList.remove('busy');
    cur.style.transition='none';cur.style.transform='translate('+Math.round(root.clientWidth*.62)+'px,70px)';cur.getBoundingClientRect();cur.style.transition='';
  }
  async function saved(){sav.textContent='Menyimpan…';sav.classList.add('busy');await w(600);sav.textContent='Tersimpan';sav.classList.remove('busy')}
  async function run(){
    await w(1400);
    for(;;){
      reset();await w(900);
      /* 1. tambah catatan */
      await mv(root.querySelector('.dm-add'));await clk();
      rows.push({id:'r5',n:'',a:'',s:-1,d:20261218,dl:'',c:0});render();tb.lastChild.classList.add('newr');await w(500);
      await mv(q('r5','.c-n'),.25);await clk();await type(q('r5','.c-n'),'Kirim penawaran klien');rows[4].n='Kirim penawaran klien';
      await mv(q('r5','.c-a'),.25);await clk();await type(q('r5','.c-a'),'Sinta');rows[4].a='Sinta';
      /* 2. pilih status */
      var cs=q('r5','.c-s');await mv(cs,.35);await clk();
      var pp=pos(cs,0,1);pop.innerHTML=SN.map(function(n,k){return '<span data-k="'+k+'">'+chip(n,k)+'</span>'}).join('');pop.hidden=false;
      var ph=pop.offsetHeight,top=pp[1]+4;if(top+ph>root.clientHeight-8)top=pos(cs,0,0)[1]-ph-4;pop.style.left=Math.round(pp[0]+8)+'px';pop.style.top=Math.round(top)+'px';await w(500);
      var op=pop.querySelector('span[data-k="1"]');await mv(op,.4,.5,700);op.classList.add('hv');await clk();
      pop.hidden=true;rows[4].s=1;render();await w(350);
      /* 3. tanggal */
      await mv(q('r5','.c-d'),.25);await clk();await type(q('r5','.c-d'),'18 Des 2026');rows[4].dl='18 Des 2026';await saved();
      /* 4. centang */
      await mv(q('r4','.ck'));await clk();rows[3].c=1;rows[3].s=2;render();await saved();await w(500);
      /* 5. urutkan */
      await mv(sb);await clk();sb.classList.add('act');sb.innerHTML='Urutkan <span class="tn">1</span>';
      flip(function(){rows.sort(function(a,b){return a.d-b.d});render()});await w(1500);
      /* 6. kanban */
      await mv(pk);await clk();pk.classList.add('on');pg.classList.remove('on');gv.hidden=true;kv.hidden=false;buildKan();await w(1100);
      var card=kv.querySelector('.kc[data-k="r2"]'),col=kv.querySelector('.kcol2[data-k="1"]');
      if(card&&col){
        await mv(card,.3,.5,800);await clk();card.classList.add('lift');
        var p1=pos(card,.3,.5),p2=pos(col,.5,.5);
        card.style.transform='translate('+Math.round(p2[0]-p1[0])+'px,'+Math.round(p2[1]-p1[1])+'px) rotate(-2deg)';
        await mv(col,.5,.5,900);rows.filter(function(r){return r.id==='r2'})[0].s=1;buildKan('r2');await saved();await w(1500);
      }
      /* 7. kembali ke grid */
      await mv(pg);await clk();pk.classList.remove('on');pg.classList.add('on');kv.hidden=true;gv.hidden=false;render();await w(2600);
    }
  }
  run().catch(function(){});
}

function submitAuth(form){
  var mode=form.dataset.mode,su=mode==='daftar';
  var name=su?form.name.value.trim():'',email=form.email.value.trim().toLowerCase(),pw=form.pw.value,err=$('#autherr');
  if(su&&!name){err.textContent='Isi nama lengkap Anda.';return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Masukkan alamat email yang valid.';return}
  if(pw.length<8){err.textContent=su?'Kata sandi minimal 8 karakter.':'Isi kata sandi Anda.';return}
  var users=st.get(UK)||{};
  sha(pw).then(function(h){
    if(su){
      if(users[email]){err.textContent='Email ini sudah terdaftar. Silakan masuk.';return}
      users[email]={name:name,h:h};st.set(UK,users);login(email,name);toast('Akun dibuat. Selamat datang, '+name.split(' ')[0]+'!');go('beranda');
    }else{
      if(!users[email]||users[email].h!==h){err.textContent='Email atau kata sandi salah.';return}
      login(email,users[email].name);go('beranda');
    }
  });
}
function demoLogin(){

  lead=i===0?'<span class="flw">Di mana</span>':i===1?'<select class="flw" data-pk="conj" aria-label="Gabungkan filter"><option value="and"'+(c.conj==='and'?' selected':'')+'>dan</option><option value="or"'+(c.conj==='or'?' selected':'')+'>atau</option></select>':'<span class="flw">'+(c.conj==='or'?'atau':'dan')+'</span>';
  var val='';
  if(NOVAL.indexOf(fl.op)<0){
    if(f.type==='select')val='<select data-pk="fl-val" data-i="'+i+'" aria-label="Nilai"><option value="">Pilih…</option>'+f.options.map(function(o){return '<option'+(o===fl.val?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>';
    else if(f.type==='date'||f.type==='created'||f.type==='modified')val='<input type="date" data-pk="fl-val" data-i="'+i+'" value="'+esc(fl.val)+'" aria-label="Nilai">';
    else val='<input type="text" data-pk="fl-val" data-i="'+i+'" value="'+esc(fl.val)+'" placeholder="Nilai" aria-label="Nilai"'+(isNumF(f)?' inputmode="decimal"':'')+'>';
  }
  return '<div class="flr">'+lead+'<select data-pk="fl-f" data-i="'+i+'" aria-label="Kolom">'+fOpts(filterFields(t),fl.f)+'</select>'+
    '<select data-pk="fl-op" data-i="'+i+'" aria-label="Kondisi">'+ops.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===fl.op?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>'+val+
    '<button class="px" data-act="popdel" data-k="filter" data-i="'+i+'" aria-label="Hapus filter">×</button></div>';
}
function popHTML(k){
  var b=curBase();if(!b)return '';
  var t=b.tables[b.tab],c=cfg(t),h='',i;
  if(k==='views'){
    return '<div class="ph">Tampilan</div><div class="pl">'+t.views.map(function(v,i){return '<button class="pi'+(i===t.vi?' on':'')+'" data-act="viewsel" data-i="'+i+'"><span>'+(i===t.vi?'✓':'')+'</span>'+esc(v.name)+'</button>'}).join('')+'</div>'+
    '<div class="pf"><button class="btn sm" data-act="viewnew">+ Tampilan baru</button><button class="btn sm" data-act="viewdup">Gandakan</button><button class="btn sm" data-act="viewren">Ubah nama</button>'+(t.views.length>1?'<button class="btn sm danger" data-act="viewdel">Hapus</button>':'')+'</div>'+
    '<p class="hint">Setiap tampilan menyimpan filter, urutan, kolom tersembunyi, pengelompokan, warna, tinggi baris, dan lebar kolomnya sendiri.</p>';
  }
  if(k==='hide'){
    return '<div class="ph">Sembunyikan kolom</div><div class="pl">'+t.fields.map(function(f,i){var vis=i===0||c.hidden.indexOf(f.id)<0;return '<label class="pc"><input type="checkbox" data-pk="hide" data-f="'+f.id+'"'+(vis?' checked':'')+(i===0?' disabled':'')+'><i>'+TICON[f.type]+'</i><span>'+esc(f.name)+'</span>'+(i===0?'<small>utama</small>':'')+'</label>'}).join('')+'</div>'+
    '<div class="pf"><button class="btn sm" data-act="popall" data-m="hide">Sembunyikan semua</button><button class="btn sm" data-act="popall" data-m="show">Tampilkan semua</button></div>';
  }
  if(k==='filter'){
    var rows=c.filters.map(function(fl,i){return fld(t,fl.f)?flRow(t,c,fl,i):''}).join('');
    return '<div class="ph">Filter</div>'+(rows?'<div class="pl2">'+rows+'</div>':'<p class="hint">Belum ada filter. Tambahkan filter untuk hanya menampilkan catatan yang cocok.</p>')+
    '<div class="pf"><button class="btn sm" data-act="popadd" data-k="filter">+ Tambah filter</button>'+(c.filters.length?'<button class="btn sm" data-act="popclr" data-k="filter">Hapus semua</button>':'')+'</div>';
  }
  if(k==='sort'){
    var sr=c.sorts.map(function(s,i){var f=fld(t,s.f);if(!f)return '';var dl=dirLabels(f);
      return '<div class="flr"><span class="flw">'+(i===0?'Urutkan':'lalu')+'</span><select data-pk="st-f" data-i="'+i+'" aria-label="Kolom">'+fOpts(filterFields(t),s.f)+'</select><select data-pk="st-d" data-i="'+i+'" aria-label="Arah"><option value="asc"'+(s.dir!=='desc'?' selected':'')+'>'+dl[0]+'</option><option value="desc"'+(s.dir==='desc'?' selected':'')+'>'+dl[1]+'</option></select><button class="px" data-act="popdel" data-k="sort" data-i="'+i+'" aria-label="Hapus urutan">×</button></div>'}).join('');
    return '<div class="ph">Urutkan</div>'+(sr?'<div class="pl2">'+sr+'</div>':'<p class="hint">Belum ada urutan. Klik nama kolom di tabel atau tambahkan urutan di sini.</p>')+
    '<div class="pf"><button class="btn sm" data-act="popadd" data-k="sort">+ Tambah urutan</button>'+(c.sorts.length?'<button class="btn sm" data-act="popclr" data-k="sort">Hapus semua</button>':'')+'</div>';
  }
  if(k==='group'){
    return '<div class="ph">Kelompokkan menurut</div><select data-pk="group" aria-label="Kolom pengelompokan">'+fOpts(t.fields.filter(function(f){return f.type!=='button'&&f.type!=='attachment'}),c.group,'Tanpa pengelompokan')+'</select><p class="hint">Catatan dikelompokkan menurut nilai kolom. Klik judul grup untuk melipat atau membukanya.</p>';
  }
  if(k==='color'){
    var sf=t.fields.filter(function(f){return f.type==='select'});
    return '<div class="ph">Warnai catatan menurut</div>'+(sf.length?'<select data-pk="color" aria-label="Kolom warna">'+fOpts(sf,c.color,'Tanpa warna')+'</select><p class="hint">Warna baris mengikuti warna pilihan pada kolom tersebut.</p>':'<p class="hint">Butuh kolom bertipe Pilihan, misalnya Status.</p>');
  }
  if(k==='rowh'){
    return '<div class="ph">Tinggi baris</div><div class="pl">'+Object.keys(RH).map(function(x){return '<label class="pc"><input type="radio" name="rh" data-pk="rh" value="'+x+'"'+(c.rh===x?' checked':'')+'><span>'+RHL[x]+'</span><small>'+RH[x]+' px</small></label>'}).join('')+'</div><p class="hint">Baris yang lebih tinggi menampilkan teks panjang pada kolom Teks.</p>';
  }
  return h;
}
function placePop(){
  var p=$('#pop');if(!p||!POP)return;
  var a=document.querySelector('[data-act="pop"][data-k="'+POP+'"]');if(!a){closePop();return}
  var r=a.getBoundingClientRect(),w=p.offsetWidth,l=Math.max(8,Math.min(r.left,innerWidth-w-8)),tp=r.bottom+6;
  p.style.left=l+'px';p.style.top=tp+'px';p.style.maxHeight=Math.max(160,innerHeight-tp-12)+'px';
}
function renderPop(){var p=$('#pop');if(!p||!POP)return;p.className='card'+(POP==='filter'?' wide':'');p.innerHTML=popHTML(POP);placePop()}
function openPop(k){
  POP=k;var p=$('#pop');
  if(!p){p=document.createElement('div');p.id='pop';p.setAttribute('role','dialog');document.body.appendChild(p)}
  p.setAttribute('aria-label','Pengaturan '+k);renderPop();drawTools();
}
function closePop(){var had=POP;POP=null;var p=$('#pop');if(p)p.remove();if(had&&$('#btools'))drawTools()}
function togglePop(k){if(POP===k)closePop();else openPop(k)}
function applyCfg(){save();drawContent();drawTools()}
function handlePk(el){
  var b=curBase();if(!b)return;
  var t=b.tables[b.tab],c=cfg(t),k=el.dataset.pk,i=+el.dataset.i,re=true,fl;
  switch(k){
    case 'hide':var ix=c.hidden.indexOf(el.dataset.f);if(el.checked){if(ix>-1)c.hidden.splice(ix,1)}else if(ix<0)c.hidden.push(el.dataset.f);re=false;break;
    case 'fl-f':fl=c.filters[i];fl.f=el.value;fl.op=opsFor(fld(t,fl.f))[0][0];fl.val='';break;
    case 'fl-op':c.filters[i].op=el.value;break;
    case 'fl-val':c.filters[i].val=el.value;re=false;break;
    case 'conj':c.conj=el.value;break;
    case 'st-f':c.sorts[i].f=el.value;break;
    case 'st-d':c.sorts[i].dir=el.value;break;
    case 'group':c.group=el.value||null;c.gc={};break;
    case 'color':c.color=el.value||null;break;
    case 'rh':c.rh=el.value;break;
  }
  applyCfg();if(re)renderPop();
}
function popAdd(k){
  var b=curBase();if(!b)return;var t=b.tables[b.tab],c=cfg(t),ff=filterFields(t);if(!ff.length)return;
  if(k==='filter')c.filters.push({f:ff[0].id,op:opsFor(ff[0])[0][0],val:''});
  else{var used=c.sorts.map(function(s){return s.f}),nf=ff.filter(function(f){return used.indexOf(f.id)<0})[0]||ff[0];c.sorts.push({f:nf.id,dir:'asc'})}
  applyCfg();renderPop();
}
function popDel(k,i){var b=curBase();if(!b)return;var c=cfg(b.tables[b.tab]);(k==='filter'?c.filters:c.sorts).splice(i,1);applyCfg();renderPop()}
function popClr(k){var b=curBase();if(!b)return;var c=cfg(b.tables[b.tab]);if(k==='filter')c.filters=[];else c.sorts=[];applyCfg();renderPop()}
function popAll(m){var b=curBase();if(!b)return;var t=b.tables[b.tab],c=cfg(t);c.hidden=m==='hide'?t.fields.slice(1).map(function(f){return f.id}):[];applyCfg();renderPop()}
function toggleSide(){
  SC=!SC;var a=$('.app');if(a)a.classList.toggle('sc',SC);
  var bt=$('[data-act="side"]');if(bt){bt.setAttribute('aria-expanded',String(!SC));bt.setAttribute('aria-label',SC?'Tampilkan menu samping':'Ciutkan menu samping')}
  st.set('tabelo-sc',SC?1:0);setTimeout(placePop,0);
}

function tabRenameModal(i){var b=curBase();if(!b||!b.tables[i])return;closePop();modal('<h2>Ubah nama tabel</h2><form id="tabform" data-i="'+i+'"><label class="lbl">Nama tabel<input name="name" maxlength="60" value="'+esc(b.tables[i].name)+'"></label><div class="mactions"><button type="button" class="btn" data-act="closemodal">Batal</button><button class="btn primary" type="submit">Simpan</button></div></form>');var inp=$('#tabform input');if(inp)inp.select()}
function viewRenameModal(){var b=curBase();if(!b)return;var v=curView(b.tables[b.tab]);closePop();modal('<h2>Ubah nama tampilan</h2><form id="renameform"><label class="lbl">Nama<input name="name" maxlength="60" value="'+esc(v.name)+'"></label><div class="mactions"><button type="button" class="btn" data-act="closemodal">Batal</button><button class="btn primary" type="submit">Simpan</button></div></form>')}
function viewDelModal(){var b=curBase();if(!b)return;var t=b.tables[b.tab];if(t.views.length<2)return;closePop();modal('<h2>Hapus tampilan?</h2><p class="muted">Tampilan “'+esc(curView(t).name)+'” dihapus. Data tabel tidak berubah.</p><div class="mactions"><button class="btn" data-act="closemodal">Batal</button><button class="btn primary" data-act="confirmvdel">Hapus</button></div>')}
function doViewDel(){var b=curBase();if(!b)return;var t=b.tables[b.tab];if(t.views.length<2)return;t.views.splice(t.vi,1);t.vi=0;SEL={};save();closeModal();drawTools();drawContent()}
/* pilih baris */
function selDelModal(ids){
  PEND=ids||Object.keys(SEL);if(!PEND.length)return;
  modal('<h2>Hapus '+PEND.length+' catatan?</h2><p class="muted">Catatan yang dipilih akan dihapus dari tabel ini. Tindakan ini tidak dapat dibatalkan.</p><div class="mactions"><button class="btn" data-act="closemodal">Batal</button><button class="btn primary" data-act="confirmseldel">Hapus</button></div>');

function doSelDel(){
  var b=curBase();if(!b||!PEND)return;var t=b.tables[b.tab],ids=PEND;PEND=null;

/* panel detail catatan */
function openDrawer(rid){DR=rid;drawDrawer()}
function closeDrawer(){DR=null;var d=$('#drawer');if(d)d.remove()}
function drawDrawer(){
  var b=curBase();if(!b||!DR){closeDrawer();return}
  var t=b.tables[b.tab],r=recOf(t,DR);if(!r){closeDrawer();return}
  var rows=rowsOf(t),i=rows.indexOf(r),vis=visFields(t),hid=t.fields.filter(function(f){return vis.indexOf(f)<0});
  var d=$('#drawer');if(!d){d=document.createElement('aside');d.id='drawer';d.className='drawer';d.setAttribute('role','dialog');d.setAttribute('aria-label','Detail catatan');document.body.appendChild(d)}
  var fl=function(f){return '<div class="df" data-dc="'+f.id+'"><div class="dl"><i>'+TICON[f.type]+'</i>'+esc(f.name)+'</div><div class="dcv">'+cellInner(t,f,r,'drawer')+'</div></div>'};
  d.innerHTML='<div class="dh"><button class="iconbtn" data-act="dprev" aria-label="Catatan sebelumnya"'+(i<1?' disabled':'')+'>↑</button><button class="iconbtn" data-act="dnext" aria-label="Catatan berikutnya"'+(i<0||i>=rows.length-1?' disabled':'')+'>↓</button>'+
    '<b class="dt">'+esc(ttl(t,r))+'</b><button class="iconbtn" data-act="dclose" aria-label="Tutup detail">×</button></div>'+
    '<div class="db">'+vis.map(fl).join('')+(hid.length?'<details class="dhid"><summary>'+hid.length+' kolom tersembunyi</summary>'+hid.map(fl).join('')+'</details>':'')+'</div>'+
    '<div class="dfoot"><span class="muted">'+(i>=0?'Catatan '+(i+1)+' dari '+rows.length:'Tidak tampil di tampilan ini')+'</span><button class="btn sm danger" data-act="drawdel">Hapus catatan</button></div>';
  document.querySelectorAll('tr.cur').forEach(function(x){x.classList.remove('cur')});
  var tr=document.querySelector('tr[data-row="'+r.id+'"]');if(tr)tr.classList.add('cur');
}
function stepDrawer(n){
  var b=curBase();if(!b||!DR)return;var t=b.tables[b.tab],rows=rowsOf(t),i=rows.map(function(x){return x.id}).indexOf(DR)+n;
  if(i>=0&&i<rows.length){DR=rows[i].id;drawDrawer();var tr=document.querySelector('tr[data-row="'+DR+'"]');if(tr)tr.scrollIntoView({block:'nearest'})}
}
function btnHTML(t,f,r){
  var c=f.btn||{},lab=esc(c.label||'Klik');
  if(c.kind==='set'){
    var tf=fld(t,c.target);
    return tf?'<button class="cellbtn" data-act="btn" data-r="'+r.id+'" data-f="'+f.id+'">'+lab+'</button>':'<button class="cellbtn" disabled>'+lab+'</button>';
  }
  var h=c.kind==='wa'?waHref(t,r,c):safeHref(tplSub(t,r,c.url||'',true));
  return h?'<a class="cellbtn" href="'+esc(h)+'" target="_blank" rel="noopener">'+lab+'</a>':'<button class="cellbtn" disabled>'+lab+'</button>';
}
function computedHTML(t,f,r){
  if(f.type==='formula'){
    var v=r.v[f.id];
    if(v===''||v==null)return '<div class="ro"></div>';
    if(typeof v==='string'&&v.charAt(0)==='#')return '<div class="ro fxe">'+esc(v)+'</div>';
    return '<div class="ro">'+esc(typeof v==='number'?(f.rp?'Rp ':'')+NF.format(v):v)+'</div>';
  }
  if(f.type==='modified')return '<div class="ro">'+esc(dt(r.mt))+'</div>';
  if(f.type==='button')return btnHTML(t,f,r);
  return '';
}
function linkCell(t,f,r){
  var items=linkItems(t,f,r);
  return '<div class="chips">'+items.map(function(i){return '<span class="lkc" title="'+esc(i.full)+'">'+esc(i.full)+'</span>'}).join('')+
    '<button class="addlk" data-act="pick" data-r="'+r.id+'" data-f="'+f.id+'" aria-label="Pilih '+esc(f.name)+'">'+(items.length?'✎':'+')+'</button></div>';
}
function attCell(t,f,r){
  var a=Array.isArray(r.v[f.id])?r.v[f.id]:[];
  return '<div class="chips">'+a.map(function(x){
    return '<button class="att'+(isImg(x)?'':' f')+'" data-act="openatt" data-r="'+r.id+'" data-f="'+f.id+'" data-a="'+x.id+'" title="'+esc(x.name)+'">'+(isImg(x)?'<img alt="" src="'+x.url+'">':'')+'<span>'+esc(x.name)+'</span></button>';
  }).join('')+'<button class="addlk" data-act="attach" data-r="'+r.id+'" data-f="'+f.id+'" aria-label="Tambah lampiran '+esc(f.name)+'">+</button></div>';
}
function cellInner(t,f,r,mode){
  var v=r.v[f.id],a='data-r="'+r.id+'" data-f="'+f.id+'" aria-label="'+esc(f.name)+'"',n;
  switch(f.type){
    case 'check':return '<input type="checkbox" '+a+(v?' checked':'')+'>';
    case 'select':
      var i=f.options.indexOf(v);
      return '<select class="chipsel'+(i<0?' empty':'')+'" '+a+' style="--k:'+(i<0?'var(--muted)':'var(--k'+(i%6)+')')+'"><option value=""></option>'+f.options.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>';
    case 'currency':
      n=parseFloat(v);
      return '<input type="text" inputmode="decimal" data-cur="1" data-raw="'+(isNaN(n)?'':n)+'" '+a+' value="'+esc(v===''||v==null||isNaN(n)?'':'Rp '+NF.format(n))+'">';
    case 'email':case 'phone':case 'url':
      var h=lkHref(f.type,v),tt={email:'Kirim email lewat Gmail',phone:'Chat lewat WhatsApp',url:'Buka tautan'}[f.type];
      return '<div class="lk"><input type="text" data-lk="'+f.type+'" '+a+' value="'+esc(v)+'"><a class="go" href="'+esc(h||'#')+'" target="_blank" rel="noopener" title="'+tt+'" aria-label="'+tt+'"'+(h?'':' hidden')+'>↗</a></div>';
    case 'barcode':
      return '<div class="lk"><input type="text" '+a+' value="'+esc(v)+'"><button class="go" data-act="scan" data-r="'+r.id+'" data-f="'+f.id+'" aria-label="Pindai kode batang" title="Pindai dengan kamera">▥</button></div>';
    case 'formula':case 'modified':case 'button':return computedHTML(t,f,r);
    case 'created':return '<div class="ro">'+esc(dt(r.ct))+'</div>';
    case 'link':return linkCell(t,f,r);
    case 'attachment':return attCell(t,f,r);
    default:
      if(f.type==='text'&&(mode==='drawer'||(mode==='grid'&&(RH[cfg(t).rh]||38)>38)))return '<textarea '+a+(mode==='drawer'?' rows="3"':'')+'>'+esc(v)+'</textarea>';
      var ty=f.type==='number'?'number':f.type==='date'?'date':'text';
      return '<input type="'+ty+'" '+a+' value="'+esc(v)+'"'+(ty==='number'?' step="any"':'')+'>';
  }
}
function cellTD(t,f,r,fz){
  var cls=(f.type==='select'?'cs':(f.type==='link'||f.type==='attachment'||f.type==='button')?'wide':'')+(fz?' fz':'');

function gridHTML(t){
  var c=cfg(t),rows=rowsOf(t),vf=visFields(t),rh=RH[c.rh]||38,tw=126,n=vf.length+2;
  vf.forEach(function(f){tw+=colW(t,f)});
  var cols='<colgroup><col style="width:78px">'+vf.map(function(f){return '<col data-f="'+f.id+'" style="width:'+colW(t,f)+'px">'}).join('')+'<col style="width:48px"></colgroup>';
  var head=vf.map(function(f,j){
    var si=-1;c.sorts.forEach(function(s,k){if(s.f===f.id&&si<0)si=k});
    var ar=si>-1?(c.sorts[si].dir==='desc'?' ↓':' ↑')+(c.sorts.length>1?'<sup>'+(si+1)+'</sup>':''):'';

function submitField(f){
  var b=curBase();if(!b)return;
  var t=b.tables[b.tab],eid=f.dataset.edit||'',ef=eid?fld(t,eid):null;
  var g=function(n){return f.elements.namedItem(n)};
  var type=ef?ef.type:$('#ftype').value,nm=g('name').value.trim();
  if(!nm){toast('Isi nama kolom.');return}
  if(t.fields.some(function(x){return x!==ef&&x.name.trim().toLowerCase()===nm.toLowerCase()})){toast('Nama kolom sudah dipakai. Pilih nama lain.');return}
  var cfg={};
  if(type==='select'){
    cfg.options=g('opts').value.split(',').map(function(s){return s.trim()}).filter(Boolean);
    if(!cfg.options.length){toast('Isi minimal satu pilihan.');return}
  }
  if(type==='formula'){
    cfg.formula=g('formula').value.trim();cfg.rp=g('rp').checked;
    if(!cfg.formula){toast('Tulis rumusnya.');return}
    try{fxRun(t,t.records[0]||{id:'x',v:{},ct:0,mt:0},cfg.formula,ef?ef.id:null)}catch(e){toast(e.message);return}
  }
  if(type==='link'){
    cfg.target=ef?ef.target:g('target').value;
    if(!cfg.target){toast('Pilih tabel tujuan.');return}
    cfg.multi=g('multi').checked;
    cfg.show=[].slice.call(f.querySelectorAll('input[name=show]:checked')).map(function(i){return i.value});
  }
  if(type==='button'){
    var kind=g('bkind').value,lab=g('blabel').value.trim();
    if(!lab){toast('Isi label tombol.');return}
    cfg.btn={label:lab,kind:kind,url:g('burl').value.trim(),phone:g('bphone').value,msg:g('bmsg').value,target:g('btarget').value,value:g('bvalue').value};
    if(kind==='url'&&!cfg.btn.url){toast('Isi tautan tombol.');return}
    if(kind==='set'&&!cfg.btn.target){toast('Pilih kolom yang akan diubah.');return}
  }
  var oldN=ef?ef.name:null,fo;
  if(ef){fo=ef;fo.name=nm}
  else{fo={id:uid(),name:nm,type:type,options:[]};t.fields.push(fo);t.records.forEach(function(r){r.v[fo.id]=blankVal(type)})}
  Object.keys(cfg).forEach(function(k){fo[k]=cfg[k]});
  if(oldN&&oldN!==nm)renameRefs(t,oldN,nm);
  t.records.forEach(function(r){recalc(t,r)});
  save();closeModal();drawContent();
  toast(ef?'Kolom diperbarui.':'Kolom “'+nm+'” ditambahkan.');
}

/* ---------- CSV ---------- */
function parseCSV(s){
  var rows=[],r=[],c='',q=false;
  for(var i=0;i<s.length;i++){var ch=s[i];
    if(q){if(ch==='"'){if(s[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','||ch===';'){r.push(c);c=''}
    else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}
    else if(ch!=='\r')c+=ch;
  }
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows.filter(function(x){return x.some(function(y){return y.trim()!==''})});
}
function importCSV(file){
  var rd=new FileReader();
  rd.onload=function(){
    var rows=parseCSV(String(rd.result||'').replace(/^﻿/,'')).slice(0,2001);
    if(rows.length<1){toast('File CSV kosong.');return}
    var head=rows[0],body=rows.slice(1);
    var fields=head.map(function(h,i){
      var vals=body.map(function(r){return (r[i]||'').trim()}).filter(Boolean);
      var num=vals.length>0&&vals.every(function(v){return v!==''&&!isNaN(Number(v))});
      return {n:h.trim()||('Kolom '+(i+1)),t:num?'number':'text'};
    });
    var data=body.map(function(r){return fields.map(function(f,i){return (r[i]||'').trim()})});
    var t=mkTable('Tabel 1',fields,data);
    var b={id:uid(),name:file.name.replace(/\.[^.]+$/,'')||'Impor CSV',wsId:D.workspaces[0].id,color:'#2E90FF',starred:false,view:'grid',opened:Date.now(),tab:0,tables:[t]};
    D.bases.push(b);save();toast('Berhasil mengimpor '+data.length+' catatan.');go('base-'+b.id);
  };
  rd.readAsText(file);
}

function groupRows(t,f,mf){

  var rows=cs.map(function(c){
    var sub=base.filter(function(r){return keyOf(f,r)===c.k}),val;
    if(!mf)val=sub.length;
    else{var a=numsOf(mf,sub).map(function(x){return x.x});if(!a.length)val=null;else{var s=stats(a);val=AN.ag==='avg'?s.mean:AN.ag==='max'?s.max:s.sum}}
    return {k:c.k,c:c.c,v:val,n:sub.length};
  });
  if(f.type==='text')rows.sort(function(a,b){return (b.v||0)-(a.v||0)});
  return rows;
}

function timeData(f,rs){

  var mn=Math.min.apply(null,ds),mx=Math.max.apply(null,ds),span=(mx-mn)/DAY,g=span<=14?'day':span<=120?'week':'month';
  function key(d){if(g==='day')return d;if(g==='week'){var dow=(new Date(d).getUTCDay()+6)%7;return d-dow*DAY}var x=new Date(d);return Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),1)}
  function nxt(k){if(g==='day')return k+DAY;if(g==='week')return k+7*DAY;var x=new Date(k);return Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,1)}

  var items=[],k=key(mn),end=key(mx),guard=0;
  while(k<=end&&guard++<400){items.push({k:k,v:m[k]||0});k=nxt(k)}
  return {g:g,items:items,miss:rs.length-ds.length};
}

    vals.forEach(function(v){m[v]=(m[v]||0)+1});
    var keys=Object.keys(m).sort(function(a,b){return m[b]-m[a]});
    if(f.type==='check'){var y=rs.filter(function(r){return r.v[f.id]}).length;sum=y+' dicentang ('+pct(y,n)+')'}
    else if(f.type==='created'||f.type==='modified'){var ds2=rs.map(function(r){return f.type==='created'?r.ct:r.mt}).filter(Boolean);if(ds2.length)sum=dt(Math.min.apply(null,ds2))+' sampai '+dt(Math.max.apply(null,ds2))}
    else if(f.type==='button'){sum='Tombol “'+((f.btn&&f.btn.label)||'')+'”'}
    else if(f.type==='attachment'){sum=rs.reduce(function(s,r){return s+(Array.isArray(r.v[f.id])?r.v[f.id].length:0)},0)+' file'}
    else if(f.type==='link'){sum=rs.filter(function(r){return Array.isArray(r.v[f.id])&&r.v[f.id].length}).length+' catatan punya tautan'}
    else if(isNumF(f)){var a=numsOf(f,rs);if(a.length){var s=stats(a.map(function(x){return x.x}));sum=fc(f,s.min)+' sampai '+fc(f,s.max)+', rata-rata '+fc(f,s.mean)}}
    else if(f.type==='date'){var d=vals.map(pd).filter(function(x){return x!=null});if(d.length)sum=fd(Math.min.apply(null,d))+' sampai '+fd(Math.max.apply(null,d))}
    else if(keys.length)sum='Terbanyak: '+keys[0]+' ('+m[keys[0]]+')';
    return '<tr><td><i class="ti">'+TICON[f.type]+'</i>'+esc(f.name)+'</td><td>'+TYPES[f.type]+'</td><td><div class="fillbar"><i style="width:'+(n?fl/n*100:0)+'%"></i></div><small>'+pct(fl,n)+'</small></td><td>'+(f.type==='check'?'2':keys.length)+'</td><td>'+esc(sum||'-')+'</td></tr>';
  }).join('');
  return '<h2 class="ash">Profil kolom</h2><p class="asub">Kelengkapan dan isi setiap kolom.</p><section class="card ac"><div class="tvw prof"><table><thead><tr><th>Kolom</th><th>Tipe</th><th>Terisi</th><th>Nilai unik</th><th>Ringkasan</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}
function tblStat(t){

}

    case 'scan':scanModal(a.dataset.r,a.dataset.f);break;
    case 'tm':AN.tm=a.dataset.v;redrawAn();break;
    case 'antbl':var nb2=anBase(),nt2=nb2&&nb2.tables.filter(function(x){return x.id===a.dataset.t})[0];if(nt2){AN.tid=nt2.id;anDefaults(nt2);$('#main').innerHTML=mainHTML('analisis');window.scrollTo(0,0)}break;
    case 'analyze':if(b){var bt=b.tables[b.tab];AN.bid=b.id;AN.tid=bt.id;anDefaults(bt);go('analisis')}break;
    case 'openbase':var ob=anBase();if(ob){var oi=ob.tables.map(function(x){return x.id}).indexOf(AN.tid);ob.tab=oi<0?0:oi;save();go('base-'+ob.id)}break;
    case 'tab':if(b&&+a.dataset.i!==b.tab){b.tab=+a.dataset.i;SEL={};closePop();closeDrawer();save();$('#main').innerHTML=baseView(b)}break;
    case 'addtable':
      if(b){b.tables.push(mkTable('Tabel '+(b.tables.length+1),[{n:'Nama',t:'text'},{n:'Catatan',t:'text'}],[['',''],['','']]));b.tab=b.tables.length-1;SEL={};closePop();closeDrawer();save();$('#main').innerHTML=baseView(b)}break;
    case 'view':if(b){b.view=a.dataset.v;closePop();save();drawTools();drawContent()}break;
    case 'sort':
      if(b){var tb=b.tables[b.tab];
        var sc2=cfg(tb),ss=sc2.sorts;
        if(ss.length===1&&ss[0].f===a.dataset.f){if(ss[0].dir==='asc')ss[0].dir='desc';else sc2.sorts=[]}else sc2.sorts=[{f:a.dataset.f,dir:'asc'}];
        applyCfg()}break;
    case 'addfield':fieldModal();break;
    case 'addrow':
      if(b){var t2=b.tables[b.tab],v={},sf=t2.fields.filter(function(x){return x.type==='select'})[0];
        t2.fields.forEach(function(f){v[f.id]=blankVal(f.type)});
        if(a.dataset.val!==undefined&&sf)v[sf.id]=a.dataset.val;
        var nr={id:uid(),v:v,ct:Date.now(),mt:Date.now()};recalc(t2,nr);t2.records.push(nr);save();drawContent();
        var ntr=document.querySelector('tr[data-row="'+nr.id+'"]');
        if(ntr){ntr.scrollIntoView({block:'nearest'});var ins=ntr.querySelector('input[type=text],textarea');if(ins)ins.focus()}
        else if(b.view==='grid')toast('Catatan ditambahkan, tetapi tidak tampil karena filter atau pencarian.');}
      break;
    case 'delrow':
      if(b){var t3=b.tables[b.tab];t3.records=t3.records.filter(function(x){return x.id!==a.dataset.r});save();drawContent()}break;
    case 'delbase':
      if(b)modal('<h2>Hapus base?</h2><p class="muted">“'+esc(b.name)+'” dan seluruh isinya akan dihapus. Tindakan ini tidak dapat dibatalkan.</p><div class="mactions"><button class="btn" data-act="closemodal">Batal</button><button class="btn primary" data-act="confirmdel">Hapus</button></div>');break;
    case 'confirmdel':
      if(b){D.bases=D.bases.filter(function(x){return x.id!==b.id});save();closeModal();toast('Base dihapus.');go('beranda')}break;
  }
});
document.addEventListener('focusin',function(e){var el=e.target;if(el.dataset&&el.dataset.cur){el.value=String(el.dataset.raw||'').replace('.',',');try{el.select()}catch(x){}}});
document.addEventListener('focusout',function(e){var el=e.target;if(el.dataset&&el.dataset.cur){var n=parseMoney(el.value);el.value=isFinite(n)?'Rp '+NF.format(n):''}});
document.addEventListener('pointerdown',function(e){
  var h=e.target.closest&&e.target.closest('.rz');if(!h)return;e.preventDefault();
  var b=curBase();if(!b)return;var col=document.querySelector('col[data-f="'+h.dataset.f+'"]'),tbl=$('table.grid');if(!col||!tbl)return;
  RZ={f:h.dataset.f,x:e.clientX,w:col.getBoundingClientRect().width,tot:tbl.getBoundingClientRect().width,col:col,tbl:tbl,t:b.tables[b.tab],nw:0};
  document.body.classList.add('rzing');
});
document.addEventListener('pointermove',function(e){if(!RZ)return;var w=Math.max(70,Math.round(RZ.w+e.clientX-RZ.x));RZ.nw=w;RZ.col.style.width=w+'px';RZ.tbl.style.width=(RZ.tot+w-RZ.w)+'px'});
function endRz(){if(!RZ)return;var r=RZ;RZ=null;document.body.classList.remove('rzing');if(r.nw){cfg(r.t).widths[r.f]=r.nw;save()}}
document.addEventListener('pointerup',endRz);document.addEventListener('pointercancel',endRz);
window.addEventListener('resize',placePop);
document.addEventListener('scroll',placePop,true);
document.addEventListener('dblclick',function(e){var tt=e.target.closest&&e.target.closest('.tab[data-i]');if(tt)tabRenameModal(+tt.dataset.i)});
window.addEventListener('hashchange',route);
route();
})();
</script>
